            color: var(--text-dark);
            touch-action: manipulation;
        }

        .wood-pattern {
            background-color: #2e1d16;

            width: 6px;
        }
        .custom-scroll::-webkit-scrollbar-track {
            background: #1b110d;
        }
        .custom-scroll::-webkit-scrollbar-thumb {
            background: #7a4f33;
            border-radius: 3px;
        }

        .tab-btn.active {
            background-color: #e5a93c;
            color: #1a100c;
            font-weight: 900;
            box-shadow: 0 2px 8px rgba(229, 169, 60, 0.4);
        }

        .toast-float {
            animation: floatUp 1.4s ease-out forwards;
        }

        @keyframes floatUp {
            0% { opacity: 0; transform: translateY(12px) scale(0.92); }
            18% { opacity: 1; transform: translateY(0) scale(1); }
            82% { opacity: 1; transform: translateY(-8px); }
            100% { opacity: 0; transform: translateY(-28px); }
        }

        .progress-bar-inner {
            transition: width 0.2s linear;
        }
    </style>
</head>

    setInterval(gameTick, 1500);
};

function gameTick() {
    if (!gameState.location) return;

    // 時間経過
    gameState.timeMin += 10;
    if (gameState.timeMin >= 60) {
        gameState.timeMin = 0;
        gameState.timeHour++;
    }

    if (gameState.timeHour >= 21) {
        gameState.timeHour = 9;
        gameState.day++;
        showToast("🌙 本日の営業を終了しました。翌日がスタートします！", "text-[#f5e6d3] bg-[#2e1d16]");
    }

    // 客の自動来店と判定
    simulateCustomerArrival();

    // 営業タブ表示中のダイナミック更新
    if (gameState.currentTab === 'ops') {
        updateOpsMenuList();
    }

    // ヘッダーUI更新
    document.getElementById('days-count').innerText = gameState.day;
    document.getElementById('time-display').innerText = 
        `${String(gameState.timeHour).padStart(2,'0')}:${String(gameState.timeMin).padStart(2,'0')}`;
    document.getElementById('stat-money').innerText = gameState.money.toLocaleString();
    document.getElementById('stat-rep').innerText = gameState.reputation;
}

// 価格弾力性による来店＆購入シミュレーション
function simulateCustomerArrival() {
    if (!gameState.equipment.pos) return;

    // 販売可能メニュー（開発済みかつ在庫があるもの）
    const available = gameState.recipes.filter(r => r.unlocked && r.stock > 0);
    if (available.length === 0) return;

    // 来店確率計算
    const baseChance = 0.35 * gameState.location.multiplier + (gameState.reputation * 0.004);
    if (Math.random() > baseChance) return;

    // 購入検討商品をランダム決定
    const item = available[Math.floor(Math.random() * available.length)];

    // 価格弾力性計算
    const ratio = item.price / item.stdPrice;
    let buyProb = 0.72;

    if (ratio > 1.0) {
        buyProb = Math.max(0.01, 0.72 - Math.pow(ratio - 1.0, 1.45) * 0.88);
    } else {
        buyProb = Math.min(0.96, 0.72 + (1.0 - ratio) * 0.55);
    }

    if (Math.random() < buyProb) {
        item.stock--;
        gameState.money += item.price;
        gameState.reputation += 1;
        showToast(`💰 ${item.icon} ${item.name} が売れました！ (+${item.price.toLocaleString()}円)`, "text-emerald-950 bg-emerald-100 border-emerald-400");
    } else {
        showToast(`😤 客「${item.name}（${item.price.toLocaleString()}円）はちょっと高すぎるな...」`, "text-amber-950 bg-amber-100 border-amber-400");
    }
}

function switchTab(tab) {
    gameState.currentTab = tab;
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    const targetBtn = document.getElementById(`tab-${tab}`);
    if (targetBtn) targetBtn.classList.add('active');
    renderView();
}

function renderView() {
    const view = document.getElementById('viewport');
    view.innerHTML = '';

    if (!gameState.location) {
        document.getElementById('nav-bar').style.display = 'none';
        renderLocationSelect(view);
        return;
    }

    document.getElementById('nav-bar').style.display = 'grid';
    document.getElementById('shop-title').innerText = gameState.location.name;
    document.getElementById('shop-location-name').innerText = `📍 ${gameState.location.name}`;

    switch (gameState.currentTab) {
        case 'ops': renderOpsView(view); break;
        case 'equip': renderEquipView(view); break;
        case 'menu': renderMenuView(view); break;
        case 'interior': renderInteriorView(view); break;
    }
}

function renderLocationSelect(container) {

        </div>
        <div class="space-y-3" id="location-list"></div>
    `;

    const list = container.querySelector('#location-list');
    locationsData.forEach(loc => {
        const card = document.createElement('div');
        card.className = "bg-white border-2 border-[#e5a93c]/60 hover:border-[#e5a93c] p-3.5 rounded-xl shadow-sm transition-all flex flex-col justify-between gap-2.5";
        card.innerHTML = `
            <div class="flex items-start justify-between">
                <div class="flex items-center gap-2.5">
                    <span class="text-3xl">${loc.icon}</span>
                    <div>
                        <h3 class="font-bold text-sm text-[#1f1512]">${loc.name}</h3>
                        <span class="text-[10px] bg-amber-100 text-amber-900 font-bold px-2 py-0.5 rounded-full">客足流動: ${loc.traffic}</span>
                    </div>
                </div>
            </div>
            <p class="text-xs text-gray-600 leading-relaxed">${loc.desc}</p>
            <div class="flex justify-between items-center pt-2 border-t border-gray-100">
                <div class="text-xs font-bold text-gray-500">初期保証契約金: <span class="text-sm font-black text-rose-700">${loc.cost.toLocaleString()}円</span></div>
                <button onclick="confirmLocation('${loc.id}')" class="bg-[#7a4f33] hover:bg-[#5e3b25] active:scale-95 text-white font-bold text-xs px-4 py-2 rounded-lg transition-all shadow-md">
                    この物件を選択
                </button>
            </div>
        `;
        list.appendChild(card);
    });
}

function confirmLocation(locId) {
    const loc = locationsData.find(l => l.id === locId);
    if (!loc) return;

    if (gameState.money < loc.cost) {
        showToast("❌ 資金が足りません！");
        return;
    }

    gameState.money -= loc.cost;
    gameState.location = loc;
    gameState.reputation += 15;
    showToast(`🎉 『${loc.name}』でカフェを開業しました！`);
    renderView();
}

        <!-- 開発済みメニューの仕込み＆価格設定 -->
        <div class="space-y-2">
            <h3 class="font-bold text-xs text-[#472d22] flex items-center gap-1">
                <span>☕</span> カフェショーケース（提供調理・仕込み＆価格設定）
            </h3>
            <div id="ops-menu-list" class="space-y-2.5"></div>
        </div>
    `;

    renderSuppliesGrid(container.querySelector('#supplies-grid'));
    updateOpsMenuList();
}

function renderSuppliesGrid(grid) {
    grid.innerHTML = '';
    Object.keys(gameState.supplies).forEach(key => {
        const sup = gameState.supplies[key];
        const item = document.createElement('div');
        item.className = "bg-[#fcf8f3] p-2.5 rounded-xl border border-amber-200/80 flex flex-col justify-between gap-1.5";
        item.innerHTML = `
            <div class="flex items-start justify-between">
                <div class="flex items-center gap-1.5">
                    <span class="text-xl">${sup.icon}</span>
                    <div>
                        <div class="font-bold text-[11px] text-[#1f1512] leading-tight">${sup.name}</div>
                        <div class="text-[9px] text-gray-500">${sup.pack}${sup.unit} / ${sup.price.toLocaleString()}円</div>
                    </div>
                </div>
            </div>
            <div class="flex items-center justify-between pt-1 border-t border-amber-100">
                <div class="text-xs font-black text-emerald-700">在庫: ${sup.count} ${sup.unit}</div>
                <button onclick="buySupply('${key}')" class="bg-[#7a4f33] hover:bg-[#5e3b25] active:scale-95 text-white font-bold text-[10px] px-2.5 py-1 rounded-lg shadow transition-all">
                    発注
                </button>
            </div>
        `;
        grid.appendChild(item);
    });
}

function buySupply(key) {
    const sup = gameState.supplies[key];
    if (!sup) return;

    if (gameState.money < sup.price) {
        showToast("❌ 資金が足りません！");
        return;
    }

    gameState.money -= sup.price;
    sup.count += sup.pack;
    showToast(`📦 『${sup.name}』を${sup.pack}${sup.unit}発注しました！`);
    renderView();
}

// 調理・仕込みプログレスバー＆メニュー管理
function updateOpsMenuList() {
    const list = document.getElementById('ops-menu-list');
    if (!list) return;

    const unlocked = gameState.recipes.filter(r => r.unlocked);
    if (unlocked.length === 0) {
        list.innerHTML = `
            <div class="bg-white p-5 rounded-2xl text-center text-xs text-gray-500 border border-gray-200">
                提供可能なメニューがありません。<br>「レシピ開発」タブで新しい商品を開発しましょう！
            </div>
        `;
        return;
    }

    list.innerHTML = '';
    unlocked.forEach(recipe => {
        // 必要原材料チェック
        let canPrepare = true;
        let missingText = [];
        for (let ing in recipe.reqIngredients) {
            const reqAmount = recipe.reqIngredients[ing];
            const currentAmount = gameState.supplies[ing].count;
            if (currentAmount < reqAmount) {
                canPrepare = false;
                missingText.push(gameState.supplies[ing].name);
            }
        }

        // 価格弾力性テキスト評価
        const ratio = recipe.price / recipe.stdPrice;
        let demandText = "適正価格（安定需要）";
        let demandColor = "text-emerald-700 bg-emerald-50 border-emerald-200";
        if (ratio > 1.35) {
            demandText = "高すぎる（客足激減）";
            demandColor = "text-rose-700 bg-rose-50 border-rose-200";
        } else if (ratio > 1.12) {
            demandText = "強気（やや不人気）";
            demandColor = "text-amber-800 bg-amber-50 border-amber-200";
        } else if (ratio < 0.88) {
            demandText = "割安（大人気！）";
            demandColor = "text-blue-700 bg-blue-50 border-blue-200";
        }

        const card = document.createElement('div');
        card.className = "bg-white p-3.5 rounded-2xl border border-gray-200 shadow-sm space-y-2.5";
        card.innerHTML = `
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-2.5">
                    <span class="text-3xl">${recipe.icon}</span>
                    <div>
                        <div class="flex items-center gap-1.5">
                            <h4 class="font-bold text-sm text-[#1f1512]">${recipe.name}</h4>
                            <span class="text-[9px] bg-amber-100 text-amber-900 px-1.5 py-0.2 rounded font-bold">${recipe.categoryName}</span>
                        </div>
                        <div class="text-[10px] text-gray-500">推定原価: 約${recipe.baseCost}円 | 相場: ${recipe.stdPrice.toLocaleString()}円</div>
                    </div>
                </div>
                <div class="text-right">
                    <span class="text-xs font-black bg-amber-100 text-amber-950 px-2.5 py-1 rounded-full border border-amber-300">店頭在庫: ${recipe.stock}個</span>
                </div>
            </div>

            <!-- 販売価格調整 ＆ 需要評価 -->
            <div class="bg-[#fbf8f5] p-2 rounded-xl flex items-center justify-between gap-2 border border-gray-200">
                <div class="flex items-center gap-1.5">
                    <span class="text-xs font-bold text-gray-700">提供価格:</span>
                    <input type="number" value="${recipe.price}" step="10" min="50" onchange="changeRecipePrice('${recipe.id}', this.value)" 
                           class="w-20 px-2 py-1 text-xs font-black border border-gray-300 rounded-lg text-right focus:outline-none focus:border-[#7a4f33]">
                    <span class="text-xs font-bold">円</span>
                </div>
                <span class="text-[10px] font-bold px-2 py-0.5 rounded-full border ${demandColor}">${demandText}</span>
            </div>

            <!-- プログレスバー（調理中表示） -->
            ${recipe.isPreparing ? `
                <div class="space-y-1">
                    <div class="flex justify-between text-[10px] font-bold text-amber-900">
                        <span>🍳 調理・仕込み中...</span>
                        <span>${recipe.prepProgress}%</span>
                    </div>
                    <div class="w-full bg-gray-200 rounded-full h-2.5 overflow-hidden">
                        <div class="bg-[#e5a93c] h-2.5 rounded-full progress-bar-inner" style="width: ${recipe.prepProgress}%"></div>
                    </div>
                </div>
            ` : `
                <button onclick="startPreparing('${recipe.id}')" ${!canPrepare ? 'disabled' : ''} 
                        class="w-full py-2 rounded-xl font-bold text-xs transition-all shadow-sm flex items-center justify-center gap-1.5
                        ${canPrepare ? 'bg-[#7a4f33] hover:bg-[#5e3b25] text-white active:scale-[0.99]' : 'bg-gray-200 text-gray-400 cursor-not-allowed'}">
                    ${canPrepare ? '🍳 仕込み調理を行う (原料1セット消費 ➔ 完成品+3)' : `❌ 不足: ${missingText.join(', ')}`}
                </button>
            `}
        `;
        list.appendChild(card);
    });
}

function changeRecipePrice(recipeId, val) {
    const r = gameState.recipes.find(item => item.id === recipeId);
    if (r) {
        const p = parseInt(val, 10);
        if (p && p > 0) {
            r.price = p;
            showToast(`価格を ${p}円 に設定しました`);
            updateOpsMenuList();
        }
    }
}

function startPreparing(recipeId) {
    const recipe = gameState.recipes.find(r => r.id === recipeId);
    if (!recipe || recipe.isPreparing) return;

    // 原材料消費
    for (let ing in recipe.reqIngredients) {
        gameState.supplies[ing].count -= recipe.reqIngredients[ing];
    }

    recipe.isPreparing = true;
    recipe.prepProgress = 0;
    updateOpsMenuList();

    // プログレスバーアニメーションタイマー
    const intervalTime = (recipe.prepTime * 1000) / 20;
    const timer = setInterval(() => {
        recipe.prepProgress += 5;
        if (recipe.prepProgress >= 100) {
            clearInterval(timer);
            recipe.isPreparing = false;
            recipe.prepProgress = 0;
            recipe.stock += 3;
            showToast(`✨ ${recipe.icon} ${recipe.name} の仕込み完了！ (在庫+3個)`);
            renderView();
        } else {
            updateOpsMenuList();
        }
    }, intervalTime);
}

function renderEquipView(container) {
    const equipMaster = [
        { key: 'pos', name: 'POSレジカウンター', icon: '🧾', price: 250000, desc: '【必須】注文受付とお会計を行うカウンター。営業の絶対必須設備。' },
        { key: 'drip', name: 'ハンドドリップカウンター', icon: '☕', price: 180000, desc: '丁寧に入れるハンドドリップ・アールグレイ抽出に必要なセット。' },
        { key: 'espresso', name: 'イタリア製エスプレッソマシン', icon: '🥛', price: 680000, desc: '濃厚カフェラテや宇治抹茶ラテを抽出する本格抽出機。' },
        { key: 'kitchen', name: '調理キッチン＆フライパン', icon: '🍳', price: 350000, desc: '小倉バタートーストやクラシックナポリタン調理用の厨房機材。' },
        { key: 'oven', name: '製菓用プロオーブン', icon: '🍞', price: 480000, desc: 'スフレパンケーキや苺ショート、ショコラテリーヌ用の高性能オーブン。' },
        { key: 'parfait', name: 'パフェ＆冷菓専用作業台', icon: '🍨', price: 300000, desc: '自家製抹茶パフェや冷製スイーツの仕上げ用ワークスペース。' }
    ];

    container.innerHTML = `
        <div class="bg-white p-3.5 rounded-xl border border-gray-200 shadow-sm mb-3">
            <h3 class="font-bold text-sm text-[#2e1d16] mb-1">⚙️ 厨房機器・カウンター設備</h3>
            <p class="text-xs text-gray-600">必要な設備を揃えることで、開発・提供できるレシピが解放されます。</p>
        </div>
        <div class="space-y-3" id="equip-list"></div>
    `;

    const list = container.querySelector('#equip-list');
    equipMaster.forEach(item => {
        const isBought = gameState.equipment[item.key];
        const card = document.createElement('div');
        card.className = "bg-white p-3.5 rounded-2xl border border-gray-200 shadow-sm flex items-center justify-between gap-3";
        card.innerHTML = `
            <div class="flex items-center gap-3">
                <span class="text-3xl">${item.icon}</span>
                <div>
                    <h4 class="font-bold text-xs text-[#1f1512]">${item.name}</h4>
                    <p class="text-[10px] text-gray-500 leading-tight mt-0.5">${item.desc}</p>
                </div>
            </div>
            <div class="text-right shrink-0">
                <div class="text-xs font-black text-rose-700 mb-1">${item.price.toLocaleString()}円</div>
                <button onclick="buyEquip('${item.key}', ${item.price})" ${isBought ? 'disabled' : ''} 
                        class="px-3 py-1.5 rounded-lg font-bold text-xs transition-all shadow-sm
                        ${isBought ? 'bg-emerald-100 text-emerald-800 cursor-default' : 'bg-[#7a4f33] hover:bg-[#5e3b25] text-white active:scale-95'}">
                    ${isBought ? '設置完了' : '購入設置'}
                </button>
            </div>
        `;
        list.appendChild(card);
    });
}

function buyEquip(key, price) {
    if (gameState.money < price) {
        showToast("❌ 資金が足りません！");
        return;
    }
    gameState.money -= price;
    gameState.equipment[key] = true;
    gameState.reputation += 12;
    showToast(`⚙️ 『${getEquipName(key)}』を導入設置しました！`);
    renderView();
}

function renderMenuView(container) {
    container.innerHTML = `
        <div class="bg-white p-3.5 rounded-xl border border-gray-200 shadow-sm mb-3">
            <h3 class="font-bold text-sm text-[#2e1d16] mb-1">📖 メニュー開発＆新レシピ考案</h3>
            <p class="text-xs text-gray-600">設備を導入したら、新メニューを試作・開発してラインナップを増やしましょう。</p>
        </div>
        <div class="space-y-3" id="recipe-list"></div>
    `;

    const list = container.querySelector('#recipe-list');
    gameState.recipes.forEach(recipe => {
        const hasEquip = gameState.equipment[recipe.reqEquip];
        const card = document.createElement('div');
        card.className = "bg-white p-3.5 rounded-2xl border border-gray-200 shadow-sm space-y-2";
        
        let equipName = getEquipName(recipe.reqEquip);

        card.innerHTML = `
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-2.5">
                    <span class="text-3xl">${recipe.icon}</span>
                    <div>
                        <div class="flex items-center gap-1.5">
                            <h4 class="font-bold text-sm text-[#1f1512]">${recipe.name}</h4>
                            <span class="text-[9px] bg-amber-100 text-amber-900 px-1.5 py-0.2 rounded font-bold">${recipe.categoryName}</span>
                        </div>
                        <div class="text-[10px] text-gray-500">標準相場: ${recipe.stdPrice.toLocaleString()}円</div>
                    </div>
                </div>
                <span class="text-xs font-bold px-2.5 py-1 rounded-full ${recipe.unlocked ? 'bg-emerald-100 text-emerald-800' : 'bg-gray-100 text-gray-500'}">
                    ${recipe.unlocked ? '開発完了' : '未解放'}
                </span>
            </div>

            <div class="text-xs text-gray-600 bg-amber-50/70 p-2 rounded-xl border border-amber-200/50 flex items-center justify-between">
                <span>必要設備: <span class="font-bold text-amber-950">${equipName}</span></span>
                <span>${hasEquip ? '✅ (設置済み)' : '❌ (未設置)'}</span>
            </div>

            <button onclick="unlockRecipe('${recipe.id}')" ${recipe.unlocked || !hasEquip ? 'disabled' : ''} 
                    class="w-full py-2 rounded-xl font-bold text-xs transition-all shadow-sm
                    ${recipe.unlocked ? 'bg-gray-200 text-gray-500 cursor-default' : (hasEquip ? 'bg-[#e5a93c] hover:bg-amber-400 text-amber-950 active:scale-95' : 'bg-gray-200 text-gray-400 cursor-not-allowed')}">
                ${recipe.unlocked ? '開発済み' : (hasEquip ? 'レシピを新開発・考案する' : '必要な設備が未設置です')}
            </button>
        `;
        list.appendChild(card);
    });
}

function unlockRecipe(recipeId) {
    const r = gameState.recipes.find(item => item.id === recipeId);
    if (r && !r.unlocked) {
        r.unlocked = true;
        gameState.reputation += 18;
        showToast(`🎉 新メニュー『${r.name}』の開発に成功しました！`);
        renderView();
    }
}

function getEquipName(key) {
    const names = {
        pos: 'POSレジカウンター',
        drip: 'ハンドドリップカウンター',
        espresso: 'イタリア製エスプレッソマシン',
        kitchen: '調理キッチン＆フライパン',
        oven: '製菓用プロオーブン',
        parfait: 'パフェ＆冷菓専用作業台'
    };
    return names[key] || '基本設備';
}

function renderInteriorView(container) {
    container.innerHTML = `
        <div class="bg-white p-3.5 rounded-xl border border-gray-200 shadow-sm mb-3">
            <h3 class="font-bold text-sm text-[#2e1d16] mb-1">🛋️ 店内カスタマイズ＆店舗改装</h3>
            <p class="text-xs text-gray-600">お店の雰囲気や居心地を向上させ、カフェ評判（集客力）を大幅に向上させます。</p>
        </div>
        <div class="space-y-3" id="interior-list"></div>
    `;

    const list = container.querySelector('#interior-list');
    Object.keys(gameState.interiors).forEach(key => {
        const item = gameState.interiors[key];
        const card = document.createElement('div');
        card.className = "bg-white p-3.5 rounded-2xl border border-gray-200 shadow-sm flex items-center justify-between gap-3";
        card.innerHTML = `
            <div class="flex items-center gap-3">
                <span class="text-3xl">${item.icon}</span>
                <div>
                    <h4 class="font-bold text-xs text-[#1f1512]">${item.name}</h4>
                    <p class="text-[10px] text-gray-500 leading-tight mt-0.5">${item.desc}</p>
                    <div class="text-[10px] font-bold text-amber-800 mt-1">評判アップ: +${item.repBoost} pt</div>
                </div>
            </div>
            <div class="text-right shrink-0">
                <div class="text-xs font-black text-rose-700 mb-1">${item.cost.toLocaleString()}円</div>
                <button onclick="buyInterior('${key}')" ${item.bought ? 'disabled' : ''} 
                        class="px-3 py-1.5 rounded-lg font-bold text-xs transition-all shadow-sm
                        ${item.bought ? 'bg-emerald-100 text-emerald-800 cursor-default' : 'bg-[#7a4f33] hover:bg-[#5e3b25] text-white active:scale-95'}">
                    ${item.bought ? '改装済み' : '改装発注'}
                </button>
            </div>
        `;
        list.appendChild(card);
    });
}

function buyInterior(key) {
    const item = gameState.interiors[key];
    if (!item || item.bought) return;

    if (gameState.money < item.cost) {
        showToast("❌ 資金が足りません！");
        return;
    }

    gameState.money -= item.cost;
    item.bought = true;
    gameState.reputation += item.repBoost;
    showToast(`✨ 『${item.name}』の店舗改装が完了しました！`);
    renderView();
}

function showToast(msg, colorClass = 'text-white bg-[#1f1512]') {
    const container = document.getElementById('toast-container');
    if (!container) return;

    const toast = document.createElement('div');
    toast.className = `toast-float px-3.5 py-2 rounded-full text-xs font-bold shadow-xl border border-amber-400/40 ${colorClass}`;
    toast.innerText = msg;

    container.appendChild(toast);
    setTimeout(() => toast.remove(), 1400);
}
</script>
</body>
</html>
