<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>モバイル専用 カフェ経営シミュレーション Pro</title>
    <style>
        :root {
            --bg-color: #f7f3ee;
            --card-bg: #ffffff;
            --text-main: #2b2118;
            --text-sub: #7a6b5d;
            --accent-brown: #4a2c11;
            --accent-brown-light: #6f4727;
            --accent-green: #2e7d32;
            --accent-amber: #e65100;
            --accent-red: #c62828;
            --border-color: #e0d5c7;
            --safe-area-bottom: env(safe-area-inset-bottom, 0px);
            --safe-area-top: env(safe-area-inset-top, 0px);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        html, body {
            width: 100%;
            height: 100%;
            height: 100dvh;
            overflow: hidden;
            background-color: #0d0805;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #game-container {
            width: 100%;
            max-width: 480px;
            height: 100%;
            height: 100dvh;
            background: var(--bg-color);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 25px rgba(0,0,0,0.6);
        }

        header {
            background: var(--accent-brown);
            color: #ffffff;
            padding: calc(var(--safe-area-top) + 6px) 10px 6px 10px;
            flex-shrink: 0;
            z-index: 20;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.95rem;
            font-weight: 700;
        }

        .save-controls {
            display: flex;
            gap: 4px;
        }

        .save-btn {
            background: rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.4);
            color: #fff;
            font-size: 0.65rem;
            padding: 2px 6px;
            border-radius: 4px;
            cursor: pointer;
        }

        .env-bar {
            display: flex;
            justify-content: space-between;
            background: rgba(0,0,0,0.25);
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.72rem;
            margin-top: 4px;
            color: #ffecb3;
        }

        .stats-bar {
            display: grid;
            grid-template-columns: 1.2fr 0.9fr 0.9fr;
            gap: 4px;
            background: var(--accent-brown-light);
            padding: 4px 6px;
            border-radius: 6px;
            margin-top: 4px;
            font-size: 0.75rem;
            font-weight: bold;
            color: #ffffff;
            text-align: center;
        }

        #viewport {
            flex: 1;
            padding: 10px;
            overflow-y: auto;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            gap: 10px;
            -webkit-overflow-scrolling: touch;
            padding-bottom: 20px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            border: 1px solid var(--border-color);
            flex-shrink: 0;
        }

        .card-title {
            font-weight: bold;
            font-size: 0.9rem;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 4px;
            color: var(--accent-brown);
        }

        .action-btn {
            width: 100%;
            min-height: 40px;
            padding: 8px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.85rem;
            color: #ffffff;
            background: var(--accent-brown);
            cursor: pointer;
            margin-top: 6px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
        }

        .action-btn:active { opacity: 0.85; transform: scale(0.98); }
        .action-btn:disabled { background: #b0bec5 !important; opacity: 0.7; transform: none; cursor: not-allowed; }

        /* 店内ビジュアルマップ */
        .cafe-map {
            width: 100%;
            background: #e8d8c8;
            border: 2px solid #6f4727;
            border-radius: 10px;
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .zone-title {
            font-weight: bold;
            font-size: 0.7rem;
            color: #5c3d2e;
            margin-bottom: 2px;
            border-bottom: 1px dashed #a1887f;
        }

        .kitchen-area {
            background: #d7ccc8;
            border-radius: 6px;
            padding: 6px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            font-size: 0.8rem;
        }

        .seating-area {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }

        .table-node {
            background: #ffffff;
            border: 1.5px solid #a1887f;
            border-radius: 8px;
            padding: 6px;
            min-height: 80px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            text-align: center;
        }

        .speech-bubble {
            position: absolute;
            top: -10px;
            background: #fff;
            border: 1px solid #795548;
            border-radius: 8px;
            padding: 1px 5px;
            font-size: 0.65rem;
            font-weight: bold;
            white-space: nowrap;
        }

        /* 手動コーヒー抽出ミニゲーム */
        .brew-box {
            background: #fff8e1;
            border: 2px dashed #ffa000;
            padding: 10px;
            border-radius: 10px;
            text-align: center;
        }

        .brew-step {
            font-size: 0.85rem;
            font-weight: bold;
            color: #e65100;
            margin-bottom: 6px;
        }

        /* 携帯（スマートフォン）UI */
        .phone-shell {
            background: #111;
            border: 4px solid #333;
            border-radius: 20px;
            padding: 10px;
            color: #fff;
            min-height: 420px;
            display: flex;
            flex-direction: column;
        }

        .phone-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.65rem;
            color: #ccc;
            margin-bottom: 8px;
            padding: 0 4px;
        }

        .app-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            max-height: 340px;
            overflow-y: auto;
            padding: 4px;
        }

        .app-icon {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 0.65rem;
            cursor: pointer;
            text-align: center;
        }

        .app-badge {
            width: 42px;
            height: 42px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            margin-bottom: 2px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        .phone-app-view {
            background: #f4f4f4;
            color: #222;
            border-radius: 12px;
            flex: 1;
            padding: 10px;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            max-height: 340px;
        }

        /* ボトムナビゲーション */
        #nav-tabs {
            display: flex;
            background: var(--accent-brown);
            overflow-x: auto;
            flex-shrink: 0;
            z-index: 20;
            padding-bottom: var(--safe-area-bottom);
        }

        .tab-item {
            flex: 1;
            min-width: 55px;
            height: 48px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 0.6rem;
            font-weight: bold;
            color: #d7ccc8;
            border: none;
            background: none;
            cursor: pointer;
            white-space: nowrap;
        }

        .tab-item.active {
            color: #ffffff;
            background: var(--accent-brown-light);
            border-top: 3px solid #ffb74d;
        }

        .float-text {
            position: fixed;
            color: #1b5e20;
            font-weight: 800;
            font-size: 1rem;
            pointer-events: none;
            animation: floatUp 0.85s forwards;
            z-index: 999;
            background: rgba(255,255,255,0.9);
            padding: 3px 8px;
            border-radius: 12px;
        }

        @keyframes floatUp {
            0% { opacity: 0; transform: translate(-50%, 10px); }
            20% { opacity: 1; transform: translate(-50%, 0); }
            100% { opacity: 0; transform: translate(-50%, -25px); }
        }
    </style>
</head>
<body>

<div id="game-container">
    <header>
        <div class="header-top">
            <span id="shop-name">☕ Cafe Simulation Pro</span>
            <div class="save-controls">
                <button class="save-btn" onclick="saveGame()">💾 保存</button>
                <button class="save-btn" onclick="loadGame()">📂 復元</button>
                <button class="save-btn" onclick="resetGame()" style="background:rgba(200,0,0,0.5);">🔄 消去</button>
            </div>
        </div>
        <div class="env-bar">
            <span>🕒 <span id="time-display">Day 1 - 08:00</span></span>
            <span>☀️ <span id="weather-display">晴れ</span></span>
            <span>🔥 集客: <span id="buzz-display">100%</span></span>
        </div>
        <div class="stats-bar">
            <div>💰 <span id="money">3,000,000</span>円</div>
            <div>⭐ <span id="reputation">0</span>pt</div>
            <div>👥 従業員: <span id="staff-count">0</span>名</div>
        </div>
    </header>

    <div id="viewport"></div>

    <nav id="nav-tabs" style="display: none;">
        <button class="tab-item active" id="tab-floor" onclick="switchTab('floor')">🏪 店内</button>
        <button class="tab-item" id="tab-brew" onclick="switchTab('brew')">☕ 手作業</button>
        <button class="tab-item" id="tab-kitchen" onclick="switchTab('kitchen')">📦 仕入れ</button>
        <button class="tab-item" id="tab-phone" onclick="switchTab('phone')">📱 携帯</button>
        <button class="tab-item" id="tab-staff" onclick="switchTab('staff')">👥 人事</button>
        <button class="tab-item" id="tab-report" onclick="switchTab('report')">📊 経営</button>
    </nav>
</div>

<script>
    const SAVE_KEY = 'CAFE_SIM_SAVE_DATA_PRO_V1';

    let state = {
        day: 1,
        hour: 8,
        money: 3000000,
        reputation: 0,
        hasShop: false,
        shopType: '',
        currentTab: 'floor',
        weather: '晴れ',
        buzzMultiplier: 1.0,

        // 固定費
        fixedCosts: { rent: 15000, utility: 5000 },
        totalFixedCostPaid: 0,

        totalRevenue: 0,
        totalCost: 0,
        totalLaborCost: 0,

        staff: { partTime: 0, fullTime: 0 },
        ingredients: { beans: 20, milk: 0, flour: 0 }, // 最初から仕入れないと限定的

        // 手動コーヒー抽出のミニゲーム状態 (0:未開始, 1:豆研磨, 2:蒸らし, 3:抽出完了)
        brewStep: 0,

        // スマホ画面の状態
        phoneApp: 'home',

        tables: [
            { id: 1, occupied: false, customer: null, item: null, state: 'empty', timer: 0 },
            { id: 2, occupied: false, customer: null, item: null, state: 'empty', timer: 0 },
            { id: 3, occupied: false, customer: null, item: null, state: 'empty', timer: 0 },
            { id: 4, occupied: false, customer: null, item: null, state: 'empty', timer: 0 }
        ],

        recipes: [
            { id: 'coffee', name: '職人淹れブレンド', icon: '☕', ingKey: 'beans', ingCost: 80, stdPrice: 600, price: 600, stock: 5 },
            { id: 'latte', name: '濃厚ラテ', icon: '🥛', ingKey: 'milk', ingCost: 120, stdPrice: 700, price: 700, stock: 0 }
        ],

        news: [
            { time: '08:00', text: '【ama news】本日のカフェ通りは穏やかな天候となる見込みです。' }
        ],
        messages: [
            { sender: 'ビルオーナー', text: '毎月（毎日）の固定費（家賃・光熱費20,000円）の振り込みをお忘れなく。' }
        ],
        mails: [
            { from: '珈琲問屋アマゾン', subject: '高品質な豆の入荷案内', body: '厳選された珈琲豆が入荷しました。仕入れタブよりいつでもご注文いただけます。' }
        ]
    };

    const CUSTOMER_AVATARS = ['👨‍💼', '👩‍💼', '👵', '👨‍🎓', '👩‍🎨', '🧔', '👩‍💻'];

    function init() {
        if (!loadGame(true)) {
            render();
        }
        setInterval(gameClockLoop, 3000);
        setInterval(customerLoop, 1500);
        setInterval(updateSeats, 1000);
    }

    /* ---- セーブ＆ロード機能 ---- */
    function saveGame() {
        localStorage.setItem(SAVE_KEY, JSON.stringify(state));
        showFloatText('💾 データを保存しました！');
    }

    function loadGame(isQuiet = false) {
        const saved = localStorage.getItem(SAVE_KEY);
        if (saved) {
            try {
                state = JSON.parse(saved);
                render();
                if (!isQuiet) showFloatText('📂 データを復元しました！');
                return true;
            } catch(e) {
                console.error(e);
            }
        }
        if (!isQuiet) alert('保存データが見つかりません。');
        return false;
    }

    function resetGame() {
        if (confirm('ゲームデータを消去して最初からやり直しますか？')) {
            localStorage.removeItem(SAVE_KEY);
            location.reload();
        }
    }

    /* ---- ゲームループ & 固定費処理 ---- */
    function gameClockLoop() {
        if (!state.hasShop) return;

        state.hour = (state.hour + 1) % 24;
        if (state.hour === 0) {
            state.hour = 7;
            state.day += 1;
            const weathers = ['晴れ', '晴れ', '曇り', '雨'];
            state.weather = weathers[Math.floor(Math.random() * weathers.length)];

            // 固定費＆人件費の自動引き落とし
            const totalFixed = state.fixedCosts.rent + state.fixedCosts.utility;
            const dailyLabor = (state.staff.partTime * 9600) + (state.staff.fullTime * 16000);
            const totalDailyDeduct = totalFixed + dailyLabor;

            state.money -= totalDailyDeduct;
            state.totalFixedCostPaid += totalFixed;
            state.totalLaborCost += dailyLabor;

            showFloatText(`固定費・人件費引落: -${totalDailyDeduct.toLocaleString()}円`);
            addNews(`【ama news】Day ${state.day} がスタートしました。本日も営業を開始します。`);
        }

        renderHeader();
    }

    function renderHeader() {
        document.getElementById('money').innerText = state.money.toLocaleString();
        document.getElementById('reputation').innerText = state.reputation.toLocaleString();
        document.getElementById('staff-count').innerText = state.staff.partTime + state.staff.fullTime;
        document.getElementById('time-display').innerText = `Day ${state.day} - ${String(state.hour).padStart(2, '0')}:00`;
        document.getElementById('weather-display').innerText = state.weather;
        document.getElementById('buzz-display').innerText = Math.round(state.buzzMultiplier * 100) + '%';
    }

    /* ---- メイン描画コントロール ---- */
    function render() {
        renderHeader();
        const view = document.getElementById('viewport');
        view.innerHTML = '';

        if (!state.hasShop) {
            document.getElementById('nav-tabs').style.display = 'none';
            view.innerHTML = `
                <div class="card" style="text-align:center; padding:18px 12px; background:linear-gradient(135deg, #fff, #fbe9e7);">
                    <div style="font-size:2.8rem; margin-bottom:4px;">☕</div>
                    <h2 style="font-size:1.1rem; color:var(--accent-brown);">カフェ開業シミュレーション</h2>
                    <p style="font-size:0.75rem; color:var(--text-sub); margin-top:4px;">開業資金 3,000,000円<br>固定費（家賃・光熱費 20,000円/日）が発生します。</p>
                </div>
                <div class="card">
                    <div style="font-weight:bold; font-size:0.95rem;">☕ 本格ハンドドリップカフェ</div>
                    <div style="font-size:0.75rem; color:var(--text-sub); margin:4px 0;">自分で豆を研磨して淹れる本格重視のカフェ。</div>
                    <button class="action-btn" onclick="startShop('自家焙煎珈琲店')">1,000,000円で出店</button>
                </div>
            `;
            return;
        }

        document.getElementById('nav-tabs').style.display = 'flex';
        document.getElementById('shop-name').innerText = state.shopType;

        if (state.currentTab === 'floor') renderFloorMap(view);
        if (state.currentTab === 'brew') renderBrewMinigame(view);
        if (state.currentTab === 'kitchen') renderKitchen(view);
        if (state.currentTab === 'phone') renderPhone(view);
        if (state.currentTab === 'staff') renderStaff(view);
        if (state.currentTab === 'report') renderReport(view);
    }

    /* 🏪 店内様子 */
    function renderFloorMap(view) {
        let html = `
            <div class="card">
                <div class="card-title">🏪 店内ライブマップ</div>
                <div class="cafe-map">
                    <div class="zone-title">🍳 カウンター・厨房</div>
                    <div class="kitchen-area">
                        <span>👨‍🍳 スタッフ: ${state.staff.partTime + state.staff.fullTime + 1}名</span>
                        <span>☕ 完成在庫: ${state.recipes[0].stock}杯</span>
                    </div>
                    <div class="zone-title">🪑 フロア客席</div>
                    <div class="seating-area">
        `;

        state.tables.forEach(t => {
            let content = '';
            if (!t.occupied) {
                content = `<div style="font-size:0.7rem; color:#8d6e63;">空席</div><div style="font-size:1.4rem; opacity:0.3;">🪑</div>`;
            } else if (t.state === 'waiting') {
                content = `<div class="speech-bubble">💭 注文中...</div><div style="font-size:1.6rem;">${t.customer}</div>`;
            } else if (t.state === 'eating') {
                content = `<div class="speech-bubble">😋 ${t.item.icon} 美味しい</div><div style="font-size:1.6rem;">${t.customer}</div>`;
            }
            html += `<div class="table-node">${content}</div>`;
        });

        html += `</div></div></div>`;
        view.innerHTML = html;
    }

    /* ☕ 手作業でコーヒーを作る機能 (ミニゲーム) */
    function renderBrewMinigame(view) {
        const canBrew = state.ingredients.beans > 0;

        let stepText = '';
        let buttonText = '';
        if (state.brewStep === 0) {
            stepText = '① 珈琲豆をミルで均一に研磨します';
            buttonText = '1. 豆を手動研磨する（豆在庫-1）';
        } else if (state.brewStep === 1) {
            stepText = '② お湯を少し注ぎ、20秒間しっかり蒸らします';
            buttonText = '2. お湯を注いで蒸らす';
        } else if (state.brewStep === 2) {
            stepText = '③ 丁寧に円を描くようにドリップ抽出します';
            buttonText = '3. ドリップしてコーヒーを抽出完了！';
        }

        view.innerHTML = `
            <div class="card">
                <div class="card-title">☕ 手作業コーヒー抽出</div>
                <p style="font-size:0.75rem; color:var(--text-sub); margin-bottom:10px;">
                    1工程ずつ丁寧に仕込むことで美味しいコーヒー（店舗在庫）を完成させます。<br>
                    <strong>珈琲豆在庫: ${state.ingredients.beans} 個</strong>
                </p>

                <div class="brew-box">
                    <div style="font-size:2.2rem; margin-bottom:4px;">
                        ${state.brewStep === 0 ? '🫘' : state.brewStep === 1 ? '🫖' : '☕'}
                    </div>
                    <div class="brew-step">${stepText}</div>
                    <button class="action-btn" ${!canBrew && state.brewStep === 0 ? 'disabled' : ''} onclick="advanceBrewStep()">
                        ${!canBrew && state.brewStep === 0 ? '珈琲豆がありません（仕入れが必要）' : buttonText}
                    </button>
                </div>
            </div>
        `;
    }

    function advanceBrewStep() {
        if (state.brewStep === 0) {
            if (state.ingredients.beans <= 0) {
                alert('珈琲豆の在庫がありません！仕入れを行ってください。');
                return;
            }
            state.ingredients.beans -= 1;
            state.brewStep = 1;
            showFloatText('ゴリゴリ... 豆を挽きました');
        } else if (state.brewStep === 1) {
            state.brewStep = 2;
            showFloatText('ふわぁ... じっくり蒸らし中');
        } else if (state.brewStep === 2) {
            state.brewStep = 0;
            state.recipes[0].stock += 1;
            showFloatText('☕ 職人ブレンドが1杯完成！');
        }
        render();
    }

    /* 📦 原材料仕入れ (仕入れ必須制限) */
    function renderKitchen(view) {
        view.innerHTML = `
            <div class="card">
                <div class="card-title">📦 原材料仕入れ所</div>
                <p style="font-size:0.75rem; color:var(--text-sub); margin-bottom:10px;">
                    ※在庫がない場合、コーヒーや商品の提供が一切できなくなります。
                </p>
                <div style="font-size:0.8rem; display:flex; flex-direction:column; gap:10px;">
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <span>🫘 珈琲豆 (20個分): 2,000円<br><small style="color:var(--text-sub);">現在庫: ${state.ingredients.beans}</small></span>
                        <button class="action-btn" style="width: auto; padding: 6px 12px;" onclick="buyIng('beans', 2000, 20)">購入</button>
                    </div>
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <span>🥛 特選牛乳 (15個分): 2,000円<br><small style="color:var(--text-sub);">現在庫: ${state.ingredients.milk}</small></span>
                        <button class="action-btn" style="width: auto; padding: 6px 12px;" onclick="buyIng('milk', 2000, 15)">購入</button>
                    </div>
