<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cafe Simulation Pro - Layout & Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #1a0f0a;
            color: #f3e8e2;
        }
        .custom-scroll::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        .custom-scroll::-webkit-scrollbar-thumb {
            background: #8d6e63;
            border-radius: 4px;
        }
        .grid-cell {
            aspect-ratio: 1;
            transition: all 0.15s ease;
        }
        .phone-screen {
            background: linear-gradient(135deg, #181824 0%, #252538 100%);
        }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col justify-between bg-amber-950 text-slate-100">

    <!-- TOP NAVIGATION HUD -->
    <header class="bg-amber-900 border-b border-amber-800 p-2 shadow-md flex-none z-20">
        <div class="flex justify-between items-center text-xs sm:text-sm font-bold mb-1">
            <div class="flex items-center gap-2">
                <span class="text-amber-200"><i class="fa-solid fa-mug-hot mr-1"></i>Cafe Sim Pro</span>
                <span id="shop-status-badge" class="bg-amber-950 text-amber-400 text-[10px] px-2 py-0.5 rounded border border-amber-700">準備中</span>
            </div>
            <div class="flex gap-1 text-xs">
                <button onclick="saveGame()" class="bg-amber-700 hover:bg-amber-600 px-2 py-1 rounded text-white shadow"><i class="fa-solid fa-floppy-disk mr-1"></i>保存</button>
                <button onclick="loadGame()" class="bg-amber-800 hover:bg-amber-700 px-2 py-1 rounded text-white shadow"><i class="fa-solid fa-folder-open mr-1"></i>復元</button>
                <button onclick="resetGame()" class="bg-rose-800 hover:bg-rose-700 px-2 py-1 rounded text-white shadow"><i class="fa-solid fa-rotate-left mr-1"></i>消去</button>
            </div>
        </div>

        <div class="grid grid-cols-3 gap-1 bg-amber-950/70 p-2 rounded-lg text-xs text-center border border-amber-800/60">
            <div>
                <span class="text-amber-400 block text-[10px]">日時 / 天気</span>
                <span id="hud-day-time">Day 1 - 08:00</span>
                <span id="hud-weather" class="ml-1 text-yellow-300">☀️ 晴れ</span>
            </div>
            <div>
                <span class="text-amber-400 block text-[10px]">資金 / 評判</span>
                <span id="hud-money" class="text-emerald-400 font-bold">¥3,000,000</span>
                <span id="hud-reputation" class="ml-1 text-amber-300">★ 0pt</span>
            </div>
            <div>
                <span class="text-amber-400 block text-[10px]">固定費 / 店舗</span>
                <span id="hud-rent" class="text-rose-300">¥0/日</span>
                <span id="hud-store-name" class="ml-1 text-cyan-300">未所有</span>
            </div>
        </div>
    </header>

    <!-- MAIN VIEWPORT -->
    <main id="main-viewport" class="flex-1 overflow-y-auto custom-scroll p-3 bg-amber-900/30 relative">
        <!-- Dynamic JS content injected here -->
    </main>

    <!-- BOTTOM TAB NAVIGATION -->
    <nav id="bottom-nav" class="bg-amber-950 border-t border-amber-800 flex justify-around p-1 text-xs text-amber-200 z-20 flex-none hidden">
        <button onclick="switchTab('layout')" id="nav-layout" class="flex-1 py-1.5 flex flex-col items-center hover:bg-amber-900/50 rounded-lg">
            <i class="fa-solid fa-compass-drafting text-base mb-0.5"></i>レイアウト
        </button>
        <button onclick="switchTab('floor')" id="nav-floor" class="flex-1 py-1.5 flex flex-col items-center hover:bg-amber-900/50 rounded-lg">
            <i class="fa-solid fa-store text-base mb-0.5"></i>店内模様
        </button>
        <button onclick="switchTab('brew')" id="nav-brew" class="flex-1 py-1.5 flex flex-col items-center hover:bg-amber-900/50 rounded-lg">
            <i class="fa-solid fa-filter text-base mb-0.5"></i>手淹れ
        </button>
        <button onclick="switchTab('shop')" id="nav-shop" class="flex-1 py-1.5 flex flex-col items-center hover:bg-amber-900/50 rounded-lg">
            <i class="fa-solid fa-boxes-packing text-base mb-0.5"></i>仕入れ
        </button>
        <button onclick="switchTab('phone')" id="nav-phone" class="flex-1 py-1.5 flex flex-col items-center hover:bg-amber-900/50 rounded-lg">
            <i class="fa-solid fa-mobile-screen-button text-base mb-0.5"></i>スマホ
        </button>
    </nav>

    <script>
        // ITEMS CATALOG FOR LAYOUT
        const CATALOG = {
            register: { type: 'register', name: 'レジカウンター', icon: '🎰', price: 150000, color: 'bg-emerald-900/80 border-emerald-600' },
            machine: { type: 'machine', name: 'ドリップカウンター', icon: '☕', price: 300000, color: 'bg-amber-900/80 border-amber-600' },
            table: { type: 'table', name: 'テーブル', icon: '🪑', price: 50000, color: 'bg-stone-800 border-stone-600' },
            chair: { type: 'chair', name: '客席チェア', icon: '💺', price: 25000, color: 'bg-stone-800 border-stone-600' },
            plant: { type: 'plant', name: '観葉植物', icon: '🪴', price: 20000, color: 'bg-green-950 border-green-700' }
        };

        const PROPERTY_OPTIONS = [
            { id: 'small', name: '小型路面店', price: 800000, rent: 12000, gridCols: 5, gridRows: 5, desc: '初心者向けのコンパクトな物件。アットホームなカフェに最適。' },
            { id: 'station', name: '駅前1Fテナント', price: 1800000, rent: 25000, gridCols: 6, gridRows: 6, desc: '人通りが多く集客効果抜群。広めのスペースで複数テーブル配置可能。' },
            { id: 'retro', name: '古民家リノベ物件', price: 1200000, rent: 18000, gridCols: 5, gridRows: 6, desc: '落ち着いた雰囲気。コーヒーの味にこだわる固定客がつきやすい。' }
        ];

        const DEFAULT_STATE = {
            day: 1,
            hour: 8,
            minute: 0,
            money: 3000000,
            reputation: 0,
            weather: '晴れ',
            isOpen: false,
            selectedProperty: null,
            activeTab: 'setup', // 'setup', 'layout', 'floor', 'brew', 'shop', 'phone'
            
            // Layout Grid
            gridCols: 5,
            gridRows: 5,
            gridData: {}, // key: "x_y" -> item object
            selectedTool: 'register', // active placement tool

            // Resources
            inventory: { beans: 500, milk: 2000, syrup: 500, cups: 100 },
            prices: { beans: 5000, milk: 1200, syrup: 800, cups: 1000 },

            // Menu
            menu: [
                { id: 'espresso', name: '職人手淹れブレンド', price: 500, cost: { beans: 15, cups: 1 }, sold: 0 },
                { id: 'latte', name: 'カフェラテ', price: 620, cost: { beans: 15, milk: 150, cups: 1 }, sold: 0 }
            ],

            // Phone Apps
            phoneTab: 'home',
            messages: [
                { sender: '不動産アテンダント', text: 'ご契約ありがとうございます！まずは機材やテーブルを配置してください。', date: 'Day 1' },
                { sender: 'ビルオーナー', text: '家賃・光熱費は毎朝引き落としとなります。遅延なきようお願いいたします。', date: 'Day 1' }
            ],

            // Manual Brew State
            brewingState: { step: 0, grindProgress: 0, bloomTimer: 0, dripVolume: 0, score: 0 }
        };

        let gameState = JSON.parse(JSON.stringify(DEFAULT_STATE));
        let gameTimer = null;

        // INITIALIZATION
        window.addEventListener('DOMContentLoaded', () => {
            loadGame(false);
            startClock();
            render();
        });

        function startClock() {
            if (gameTimer) clearInterval(gameTimer);
            gameTimer = setInterval(() => {
                if (!gameState.isOpen) return;

                gameState.minute += 15;
                if (gameState.minute >= 60) {
                    gameState.minute = 0;
                    gameState.hour += 1;
                }

                if (gameState.hour >= 21) {
                    endDay();
                } else {
                    simulateCustomers();
                }
                updateHUD();
            }, 3000);
        }

        function endDay() {
            gameState.hour = 8;
            gameState.minute = 0;
            gameState.day += 1;

            // Fixed Cost Deduction
            if (gameState.selectedProperty) {
                gameState.money -= gameState.selectedProperty.rent;
                notify(`固定費（家賃・光熱費）¥${gameState.selectedProperty.rent.toLocaleString()} を支払いました`);
            }

            const weathers = ['晴れ', '晴れ', '曇り', '雨'];
            gameState.weather = weathers[Math.floor(Math.random() * weathers.length)];
            render();
        }

        function simulateCustomers() {
            const hasBeans = gameState.inventory.beans >= 15;
            const hasCups = gameState.inventory.cups >= 1;
            if (!hasBeans || !hasCups) return;

            // Check if capacity exists (Count tables)
            const tableCount = Object.values(gameState.gridData).filter(item => item.type === 'table').length;
            if (tableCount === 0) return;

            if (Math.random() < 0.5) {
                const item = gameState.menu[Math.floor(Math.random() * gameState.menu.length)];
                
                // Deduct inventory
                let canBrew = true;
                for (let ing in item.cost) {
                    if (gameState.inventory[ing] < item.cost[ing]) {
                        canBrew = false;
                        break;
                    }
                }

                if (canBrew) {
                    for (let ing in item.cost) {
                        gameState.inventory[ing] -= item.cost[ing];
                    }
                    gameState.money += item.price;
                    item.sold = (item.sold || 0) + 1;
                    gameState.reputation += 2;
                    notify(`☕ お客さまが「${item.name}」を購入！(+¥${item.price})`);
                }
            }
        }

        function updateHUD() {
            document.getElementById('hud-day-time').innerText = `Day ${gameState.day} - ${String(gameState.hour).padStart(2, '0')}:${String(gameState.minute).padStart(2, '0')}`;
            document.getElementById('hud-weather').innerText = `${gameState.weather === '晴れ' ? '☀️' : '🌧️'} ${gameState.weather}`;
            document.getElementById('hud-money').innerText = `¥${gameState.money.toLocaleString()}`;
            document.getElementById('hud-reputation').innerText = `★ ${gameState.reputation}pt`;
            
            if (gameState.selectedProperty) {
                document.getElementById('hud-rent').innerText = `¥${gameState.selectedProperty.rent.toLocaleString()}/日`;
                document.getElementById('hud-store-name').innerText = gameState.selectedProperty.name;
            } else {
                document.getElementById('hud-rent').innerText = '¥0/日';
                document.getElementById('hud-store-name').innerText = '未契約';
            }

            const statusBadge = document.getElementById('shop-status-badge');
            if (gameState.isOpen) {
                statusBadge.innerText = '営業中';
                statusBadge.className = 'bg-emerald-900 text-emerald-300 text-[10px] px-2 py-0.5 rounded border border-emerald-600';
            } else {
                statusBadge.innerText = '準備中';
                statusBadge.className = 'bg-amber-950 text-amber-400 text-[10px] px-2 py-0.5 rounded border border-amber-700';
            }
        }

        function switchTab(tab) {
            gameState.activeTab = tab;
            render();
        }

        function render() {
            updateHUD();
            const vp = document.getElementById('main-viewport');
            const nav = document.getElementById('bottom-nav');

            if (!gameState.selectedProperty) {
                nav.classList.add('hidden');
                vp.innerHTML = renderPropertySelectionView();
                return;
            }

            nav.classList.remove('hidden');
            
            // Highlight active nav
            document.querySelectorAll('nav button').forEach(btn => btn.classList.remove('text-amber-400'));
            const activeNavBtn = document.getElementById(`nav-${gameState.activeTab}`);
            if (activeNavBtn) activeNavBtn.classList.add('text-amber-400');

            switch (gameState.activeTab) {
                case 'layout':
                    vp.innerHTML = renderLayoutEditorView();
                    break;
                case 'floor':
                    vp.innerHTML = renderFloorMapView();
                    break;
                case 'brew':
                    vp.innerHTML = renderBrewView();
                    break;
                case 'shop':
                    vp.innerHTML = renderShopView();
                    break;
                case 'phone':
                    vp.innerHTML = renderPhoneView();
                    break;
                default:
                    vp.innerHTML = renderLayoutEditorView();
            }
        }

        /* 1. STORE PROPERTY SELECTION VIEW */
        function renderPropertySelectionView() {
            return `
                <div class="space-y-4 max-w-lg mx-auto py-2">
                    <div class="bg-amber-900/60 p-4 rounded-xl border border-amber-700 text-center">
                        <i class="fa-solid fa-store text-4xl text-amber-300 mb-2"></i>
                        <h2 class="text-lg font-bold text-amber-100">店舗物件の選択・契約</h2>
                        <p class="text-xs text-amber-300 mt-1">カフェ経営の第一歩！予算に合わせて物件を購入しましょう。</p>
                    </div>

                    <div class="space-y-3">
                        ${PROPERTY_OPTIONS.map(p => `
                            <div class="bg-amber-950/80 p-4 rounded-xl border border-amber-800 space-y-2">
                                <div class="flex justify-between items-start">
                                    <div>
                                        <h3 class="font-bold text-amber-200 text-base">${p.name}</h3>
                                        <p class="text-xs text-slate-300 mt-0.5">${p.desc}</p>
                                    </div>
                                    <span class="text-xs bg-amber-900 text-amber-300 px-2 py-1 rounded font-mono">${p.gridCols}×${p.gridRows} マス</span>
                                </div>
                                <div class="flex justify-between items-center text-xs border-t border-amber-900/60 pt-2 mt-2">
                                    <div>
                                        <span class="text-slate-400">物件価格:</span> <span class="text-emerald-400 font-bold">¥${p.price.toLocaleString()}</span><br>
                                        <span class="text-slate-400">日歩固定費:</span> <span class="text-rose-300 font-bold">¥${p.rent.toLocaleString()}</span>
                                    </div>
                                    <button onclick="buyProperty('${p.id}')" class="bg-emerald-600 hover:bg-emerald-500 font-bold px-4 py-2 rounded-lg text-xs shadow text-white">
                                        契約・購入
                                    </button>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function buyProperty(propId) {
            const prop = PROPERTY_OPTIONS.find(p => p.id === propId);
            if (!prop) return;
            if (gameState.money < prop.price) {
                notify('資金が不足しています！');
                return;
            }

            gameState.money -= prop.price;
            gameState.selectedProperty = prop;
            gameState.gridCols = prop.gridCols;
            gameState.gridRows = prop.gridRows;
            gameState.activeTab = 'layout';
            notify(`${prop.name}の契約が完了しました！内装をレイアウトしましょう。`);
            render();
        }

        /* 2. LAYOUT / EQUIPMENT PLACEMENT GRID EDITOR */
        function renderLayoutEditorView() {
            // Check requirements for Opening
            const hasRegister = Object.values(gameState.gridData).some(item => item.type === 'register');
            const hasMachine = Object.values(gameState.gridData).some(item => item.type === 'machine');
            const hasTable = Object.values(gameState.gridData).some(item => item.type === 'table');
            const readyToOpen = hasRegister && hasMachine && hasTable;

            return `
                <div class="space-y-3">
                    <div class="bg-amber-900/50 p-3 rounded-xl border border-amber-700/60 flex justify-between items-center">
                        <div>
                            <h2 class="font-bold text-amber-200 text-sm"><i class="fa-solid fa-pen-ruler mr-1"></i> 店舗レイアウト編集</h2>
                            <p class="text-[11px] text-amber-300">ツールを選んで格子状のマップをタップして配置・除去します。</p>
                        </div>
                        <button onclick="toggleOpenShop()" ${!readyToOpen && !gameState.isOpen ? 'disabled' : ''} 
                            class="px-4 py-2 rounded-lg font-bold text-xs shadow ${gameState.isOpen ? 'bg-rose-700 hover:bg-rose-600' : readyToOpen ? 'bg-emerald-600 hover:bg-emerald-500' : 'bg-slate-700 text-slate-400 cursor-not-allowed'} text-white">
                            ${gameState.isOpen ? '一時閉店' : 'グランドオープン！'}
                        </button>
                    </div>

                    <!-- REQUIREMENTS CHECKLIST -->
                    <div class="flex gap-2 text-[10px] bg-amber-950/80 p-2 rounded-lg border border-amber-800 justify-around">
                        <span class="${hasRegister ? 'text-emerald-400' : 'text-slate-400'}">${hasRegister ? '✓' : '✗'} レジ</span>
                        <span class="${hasMachine ? 'text-emerald-400' : 'text-slate-400'}">${hasMachine ? '✓' : '✗'} ドリップカウンター</span>
                        <span class="${hasTable ? 'text-emerald-400' : 'text-slate-400'}">${hasTable ? '✓' : '✗'} テーブル</span>
                    </div>

                    <!-- TOOL PALETTE -->
                    <div class="grid grid-cols-3 sm:grid-cols-6 gap-1.5 bg-amber-950/90 p-2 rounded-xl border border-amber-800">
                        ${Object.keys(CATALOG).map(key => {
                            const item = CATALOG[key];
                            const isSelected = gameState.selectedTool === key;
                            return `
                                <button onclick="selectTool('${key}')" class="p-2 rounded-lg text-center border text-xs transition-all ${isSelected ? 'bg-amber-600 border-amber-300 text-white shadow-lg' : 'bg-amber-900/60 border-amber-800 text-amber-200 hover:bg-amber-800'}">
                                    <div class="text-base">${item.icon}</div>
                                    <div class="font-bold text-[10px] truncate">${item.name}</div>
                                    <div class="text-[9px] text-amber-300">¥${item.price.toLocaleString()}</div>
                                </button>
                            `;
                        }).join('')}
                        <button onclick="selectTool('remove')" class="p-2 rounded-lg text-center border text-xs ${gameState.selectedTool === 'remove' ? 'bg-rose-700 border-rose-400 text-white' : 'bg-amber-900/60 border-amber-800 text-amber-200'}">
                            <div class="text-base">🗑️</div>
                            <div class="font-bold text-[10px]">撤去</div>
                            <div class="text-[9px] text-slate-400">返金なし</div>
                        </button>
                    </div>

                    <!-- INTERACTIVE GRID -->
                    <div class="bg-amber-950/90 p-3 rounded-2xl border border-amber-800 flex justify-center overflow-x-auto">
                        <div class="grid gap-1 bg-amber-900/40 p-2 rounded-xl border border-amber-800/80" style="grid-template-columns: repeat(${gameState.gridCols}, minmax(0, 1fr)); width: min(100%, 360px);">
                            ${renderGridCells()}
                        </div>
                    </div>
                </div>
            `;
        }

        function renderGridCells() {
            let cells = '';
            for (let y = 0; y < gameState.gridRows; y++) {
                for (let x = 0; x < gameState.gridCols; x++) {
                    const key = `${x}_${y}`;
                    const placed = gameState.gridData[key];
                    cells += `
                        <div onclick="clickCell(${x}, ${y})" class="grid-cell rounded-lg border flex flex-col items-center justify-center text-lg font-bold cursor-pointer hover:opacity-80 active:scale-95 shadow-inner ${placed ? CATALOG[placed.type]?.color || 'bg-amber-900' : 'bg-amber-900/30 border-amber-800/60 hover:bg-amber-800/40'}">
                            ${placed ? CATALOG[placed.type]?.icon || '❓' : ''}
                        </div>
                    `;
                }
            }
            return cells;
        }

        function selectTool(toolKey) {
            gameState.selectedTool = toolKey;
            render();
        }

        function clickCell(x, y) {
            const key = `${x}_${y}`;

            if (gameState.selectedTool === 'remove') {
                if (gameState.gridData[key]) {
                    delete gameState.gridData[key];
                    notify('設置物を撤去しました。');
                }
            } else {
                const itemConfig = CATALOG[gameState.selectedTool];
                if (!itemConfig) return;

                if (!gameState.gridData[key]) {
                    if (gameState.money < itemConfig.price) {
                        notify('購入資金が足りません！');
                        return;
                    }
                    gameState.money -= itemConfig.price;
                    gameState.gridData[key] = { type: gameState.selectedTool };
                    notify(`${itemConfig.name}を設置しました (-¥${itemConfig.price.toLocaleString()})`);
                }
            }
            render();
        }

        function toggleOpenShop() {
            gameState.isOpen = !gameState.isOpen;
            if (gameState.isOpen) {
                notify('🎉 カフェが開業しました！営業スタート！');
                gameState.activeTab = 'floor';
            } else {
                notify('一時閉店しました。');
            }
            render();
        }

        /* 3. STORE FLOOR MAP VIEW */
        function renderFloorMapView() {
            return `
                <div class="space-y-3">
                    <div class="bg-amber-900/50 p-3 rounded-xl border border-amber-700/60 flex justify-between items-center">
                        <h2 class="font-bold text-amber-200 text-sm"><i class="fa-solid fa-store mr-1"></i> 店内リアルタイムモニタ</h2>
                        <span class="text-xs text-amber-300">客席数: ${Object.values(gameState.gridData).filter(i => i.type === 'table').length} 席</span>
                    </div>

                    <div class="bg-amber-950/90 p-4 rounded-2xl border border-amber-800 text-center">
                        <div class="grid gap-1 bg-amber-900/40 p-2 rounded-xl border border-amber-800/80 mx-auto" style="grid-template-columns: repeat(${gameState.gridCols}, minmax(0, 1fr)); width: min(100%, 320px);">
                            ${renderGridCells()}
                        </div>
                        <p class="text-xs text-amber-300/80 mt-3">※レイアウトタブで機材や席の追加・移動が可能です。</p>
                    </div>
                </div>
            `;
        }

        /* 4. MANUAL BREWING MINI-GAME VIEW */
        function renderBrewView() {
            const brew = gameState.brewingState;
            return `
                <div class="bg-amber-900/50 p-4 rounded-xl border border-amber-700/60 text-center space-y-4">
                    <h2 class="text-sm font-bold text-amber-200"><i class="fa-solid fa-hand-holding-droplet mr-1"></i> 手淹れドリップ体験</h2>

                    <div class="bg-amber-950/90 p-5 rounded-xl border border-amber-800 max-w-xs mx-auto space-y-4">
                        ${brew.step === 0 ? `
                            <div class="py-4 space-y-3">
                                <div class="text-4xl">🫘</div>
                                <button onclick="startBrewing()" class="w-full bg-amber-600 hover:bg-amber-500 font-bold py-2.5 rounded-lg text-xs text-white shadow">
                                    ハンドドリップ開始 (豆15g消費)
                                </button>
                            </div>
                        ` : ''}

                        ${brew.step === 1 ? `
                            <div class="space-y-2">
                                <div class="text-xs font-bold text-amber-300">① 豆を挽く</div>
                                <div class="w-full bg-amber-900 h-3 rounded-full overflow-hidden border border-amber-700">
                                    <div class="bg-amber-500 h-full" style="width:${brew.grindProgress}%"></div>
                                </div>
                                <button onclick="advanceGrind()" class="w-full bg-amber-700 text-white font-bold py-2 rounded text-xs shadow">ミルを挽く (${brew.grindProgress}%)</button>
                            </div>
                        ` : ''}

                        ${brew.step === 2 ? `
                            <div class="space-y-2">
                                <div class="text-xs font-bold text-amber-300">② 蒸らし (20〜25秒)</div>
                                <div class="text-2xl font-mono text-amber-100">${(brew.bloomTimer / 10).toFixed(1)} 秒</div>
                                <div class="flex gap-2">
                                    <button onclick="toggleBloomTimer()" class="flex-1 ${brew.timerRunning ? 'bg-rose-700' : 'bg-emerald-700'} text-white font-bold py-2 rounded text-xs">
                                        ${brew.timerRunning ? '停止' : '蒸らしスタート'}
                                    </button>
                                    <button onclick="finishBloom()" class="flex-1 bg-amber-700 text-white font-bold py-2 rounded text-xs">次へ</button>
                                </div>
                            </div>
                        ` : ''}

                        ${brew.step === 3 ? `
                            <div class="space-y-2">
                                <div class="text-xs font-bold text-amber-300">③ 抽出 (目標 200ml)</div>
                                <div class="text-2xl font-mono text-cyan-300">${brew.dripVolume} ml</div>
                                <div class="flex gap-2">
                                    <button onclick="addDripVolume(20)" class="flex-1 bg-amber-700 text-white font-bold py-2 rounded text-xs">注ぐ (+20ml)</button>
                                    <button onclick="finishDrip()" class="flex-1 bg-emerald-700 text-white font-bold py-2 rounded text-xs">完了</button>
                                </div>
                            </div>
                        ` : ''}

                        ${brew.step === 4 ? `
                            <div class="space-y-2 py-2">
                                <div class="text-3xl text-amber-400">🏆</div>
                                <div class="text-base font-bold text-emerald-400">評価: ${brew.score} 点</div>
                                <button onclick="resetBrew()" class="w-full bg-amber-700 text-white font-bold py-2 rounded text-xs">もう一度淹れる</button>
                            </div>
                        ` : ''}
                    </div>
                </div>
            `;
        }

        function startBrewing() {
            if (gameState.inventory.beans < 15) {
                notify('豆の在庫が足りません！仕入れてください。');
                return;
            }
            gameState.inventory.beans -= 15;
            gameState.brewingState = { step: 1, grindProgress: 0, bloomTimer: 0, dripVolume: 0, score: 0 };
            render();
        }

        function advanceGrind() {
            gameState.brewingState.grindProgress += 25;
            if (gameState.brewingState.grindProgress >= 100) gameState.brewingState.step = 2;
            render();
        }

        let bloomInt = null;
        function toggleBloomTimer() {
            const b = gameState.brewingState;
            if (b.timerRunning) {
                clearInterval(bloomInt);
                b.timerRunning = false;
            } else {
                b.timerRunning = true;
                bloomInt = setInterval(() => {
                    b.bloomTimer += 1;
                    render();
                }, 100);
            }
            render();
        }

        function finishBloom() {
            if (bloomInt) clearInterval(bloomInt);
            gameState.brewingState.timerRunning = false;
            gameState.brewingState.step = 3;
            render();
        }

        function addDripVolume(v) {
            gameState.brewingState.dripVolume += v;
            render();
        }

        function finishDrip() {
            const b = gameState.brewingState;
            const bloomSec = b.bloomTimer / 10;
            const bloomScore = Math.max(0, 50 - Math.abs(22 - bloomSec) * 5);
            const dripScore = Math.max(0, 50 - Math.abs(200 - b.dripVolume) * 0.5);
            b.score = Math.round(bloomScore + dripScore);
            b.step = 4;
            gameState.reputation += Math.floor(b.score / 10);
            render();
        }

        function resetBrew() {
            gameState.brewingState = { step: 0, grindProgress: 0, bloomTimer: 0, dripVolume: 0, score: 0 };
            render();
        }

        /* 5. PURCHASING / KITCHEN SUPPLIES VIEW */
        function renderShopView() {
            return `
                <div class="space-y-3">
                    <div class="bg-amber-900/50 p-3 rounded-xl border border-amber-700/60">
                        <h2 class="font-bold text-amber-200 text-sm"><i class="fa-solid fa-boxes-packing mr-1"></i> 原材料の仕入れ</h2>
                    </div>

                    <div class="space-y-2">
                        <div class="bg-amber-950/80 p-3 rounded-xl border border-amber-800 flex justify-between items-center text-xs">
                            <div>
                                <div class="font-bold text-amber-100">珈琲豆 (500g)</div>
                                <div class="text-slate-400">現在庫: ${gameState.inventory.beans}g</div>
                            </div>
                            <button onclick="buyIngredient('beans', 500, ${gameState.prices.beans})" class="bg-emerald-600 hover:bg-emerald-500 font-bold px-3 py-1.5 rounded text-white">¥${gameState.prices.beans.toLocaleString()}</button>
                        </div>
                        <div class="bg-amber-950/80 p-3 rounded-xl border border-amber-800 flex justify-between items-center text-xs">
                            <div>
                                <div class="font-bold text-amber-100">牛乳 (1,000ml)</div>
                                <div class="text-slate-400">現在庫: ${gameState.inventory.milk}ml</div>
                            </div>
                            <button onclick="buyIngredient('milk', 1000, ${gameState.prices.milk})" class="bg-emerald-600 hover:bg-emerald-500 font-bold px-3 py-1.5 rounded text-white">¥${gameState.prices.milk.toLocaleString()}</button>
                        </div>
                        <div class="bg-amber-950/80 p-3 rounded-xl border border-amber-800 flex justify-between items-center text-xs">
                            <div>
                                <div class="font-bold text-amber-100">テイクアウトカップ (100個)</div>
                                <div class="text-slate-400">現在庫: ${gameState.inventory.cups}個</div>
                            </div>
                            <button onclick="buyIngredient('cups', 100, ${gameState.prices.cups})" class="bg-emerald-600 hover:bg-emerald-500 font-bold px-3 py-1.5 rounded text-white">¥${gameState.prices.cups.toLocaleString()}</button>
                        </div>
                    </div>
                </div>
            `;
        }

        function buyIngredient(type, amount, cost) {
            if (gameState.money < cost) {
                notify('資金が足りません！');
                return;
            }
            gameState.money -= cost;
            gameState.inventory[type] += amount;
            notify(`仕入れ完了 +${amount}`);
            render();
        }

        /* 6. SMARTPHONE SIMULATION VIEW */
        function renderPhoneView() {
            return `
                <div class="max-w-xs mx-auto phone-screen h-[460px] rounded-3xl border-4 border-slate-700 p-3 flex flex-col justify-between shadow-2xl relative overflow-hidden">
                    <div class="flex justify-between items-center text-[9px] text-slate-400 border-b border-slate-700/50 pb-1">
                        <span>ama OS</span>
                        <span>12:00</span>
                        <span>100%</span>
                    </div>

                    <div class="flex-1 my-2 overflow-y-auto custom-scroll text-slate-200">
                        ${renderPhoneApps()}
                    </div>

                    <div class="bg-slate-900 p-1.5 rounded-xl flex justify-around border border-slate-700/50">
                        <button onclick="setPhoneTab('home')" class="text-slate-300"><i class="fa-solid fa-house"></i></button>
                        <button onclick="setPhoneTab('news')" class="text-slate-300"><i class="fa-solid fa-newspaper"></i></button>
                        <button onclick="setPhoneTab('mail')" class="text-slate-300"><i class="fa-solid fa-envelope"></i></button>
                    </div>
                </div>
            `;
        }

        function renderPhoneApps() {
            if (gameState.phoneTab === 'news') {
                return `
                    <div class="space-y-2 text-xs">
                        <div class="font-bold text-amber-400 border-b border-slate-700 pb-1">ama news</div>
                        <div class="bg-slate-800/80 p-2 rounded border border-slate-700">【カフェニュース】近隣エリアにカフェ続々オープン。</div>
                    </div>
                `;
            } else if (gameState.phoneTab === 'mail') {
                return `
                    <div class="space-y-2 text-xs">
                        <div class="font-bold text-cyan-400 border-b border-slate-700 pb-1">ama mail / Message</div>
                        ${gameState.messages.map(m => `
                            <div class="bg-slate-800/80 p-2 rounded border border-slate-700">
                                <div class="text-[9px] text-slate-400">${m.sender}</div>
                                <div class="text-slate-200 mt-0.5">${m.text}</div>
                            </div>
                        `).join('')}
                    </div>
                `;
            } else {
                let dummyApps = Array.from({length: 60}, (_, i) => i + 1);
                return `
                    <div class="grid grid-cols-4 gap-2 text-center text-[8px]">
                        <div onclick="setPhoneTab('news')" class="flex flex-col items-center cursor-pointer">
                            <div class="w-8 h-8 bg-amber-600 rounded-lg flex items-center justify-center text-white text-sm">📰</div>
                            <span class="mt-0.5">news</span>
                        </div>
                        <div onclick="setPhoneTab('mail')" class="flex flex-col items-center cursor-pointer">
                            <div class="w-8 h-8 bg-cyan-600 rounded-lg flex items-center justify-center text-white text-sm">📧</div>
                            <span class="mt-0.5">Message</span>
                        </div>
                        ${dummyApps.map(a => `
                            <div class="flex flex-col items-center opacity-60">
                                <div class="w-8 h-8 bg-slate-800 rounded-lg flex items-center justify-center text-slate-400 text-xs border border-slate-700">📱</div>
                                <span class="mt-0.5">App ${a}</span>
                            </div>
                        `).join('')}
                    </div>
                `;
            }
        }

        function setPhoneTab(t) {
            gameState.phoneTab = t;
            render();
        }

        /* LOCAL STORAGE SYSTEM */
        function saveGame() {
            localStorage.setItem('cafe_sim_pro_layout_save', JSON.stringify(gameState));
            notify('セーブデータを保存しました！');
        }

        function loadGame(userTriggered = true) {
            const saved = localStorage.getItem('cafe_sim_pro_layout_save');
            if (saved) {
                try {
                    gameState = JSON.parse(saved);
                    if (userTriggered) notify('セーブデータを復元しました！');
                } catch(e) {
                    console.error(e);
                }
            } else if (userTriggered) {
                notify('保存されたデータがありません。');
            }
            render();
        }

        function resetGame() {
            if (confirm('ゲーム進行をリセットして最初からやり直しますか？')) {
                localStorage.removeItem('cafe_sim_pro_layout_save');
                gameState = JSON.parse(JSON.stringify(DEFAULT_STATE));
                notify('データをリセットしました。');
                render();
            }
        }

        function notify(msg) {
            const toast = document.createElement('div');
            toast.className = 'fixed top-16 left-1/2 -translate-x-1/2 bg-amber-900 border border-amber-600 text-amber-100 text-xs px-4 py-2 rounded-full shadow-2xl z-50 transition-all duration-300';
            toast.innerText = msg;
            document.body.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            }, 2000);
        }
    </script>
</body>
</html>
