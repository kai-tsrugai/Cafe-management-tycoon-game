<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">

    <style>
        :root {
            --bg-color: #f7f3ee;
            --card-bg: #ffffff;
            --text-main: #2b2118;
            --text-sub: #7a6b5d;
            --accent-brown: #4a2c11;
            --accent-brown-light: #6f4727;
            --accent-green: #2e7d32;
            --accent-amber: #e65100;
            --accent-red: #c62828;
            --border-color: #e0d5c7;
            --safe-area-bottom: env(safe-area-inset-bottom, 0px);
            --safe-area-top: env(safe-area-inset-top, 0px);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Kaku Gothic ProN", sans-serif;
        }

        html, body {
            width: 100%;
            height: 100%;
            height: 100dvh;
            overflow: hidden;
            background-color: #0d0805;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* モバイルコンテナ */
        #game-container {
            width: 100%;
            max-width: 480px;
            height: 100%;
            height: 100dvh;
            background: var(--bg-color);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 25px rgba(0,0,0,0.6);
        }

        /* ヘッダー */
        header {
            background: var(--accent-brown);
            color: #ffffff;
            padding: calc(var(--safe-area-top) + 8px) 12px 8px 12px;
            shrink: 0;
            z-index: 20;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .env-bar {
            display: flex;
            justify-content: space-between;
            background: rgba(0,0,0,0.25);
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.75rem;
            margin-top: 6px;
            color: #ffecb3;
        }

        .stats-bar {
            display: grid;
            grid-template-columns: 1.2fr 0.9fr 0.9fr;
            gap: 4px;
            background: var(--accent-brown-light);
            padding: 6px 8px;
            border-radius: 6px;
            margin-top: 6px;
            font-size: 0.8rem;
            font-weight: bold;
            color: #ffffff;
            text-align: center;
        }

        /* スクロール可能なメインビュー領域 */
        #viewport {
            flex: 1;
            padding: 12px;
            overflow-y: auto;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            gap: 12px;
            -webkit-overflow-scrolling: touch;
            padding-bottom: 20px;
        }

        /* カードデザイン */
        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 14px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            border: 1px solid var(--border-color);
            shrink: 0;
        }

        .card-title {
            font-weight: bold;
            font-size: 0.95rem;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 6px;
            color: var(--accent-brown);
        }

        .action-btn {
            width: 100%;
            min-height: 44px;
            padding: 10px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.9rem;
            color: #ffffff;
            background: var(--accent-brown);
            cursor: pointer;
            margin-top: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            transition: background 0.15s, transform 0.1s;
        }

        .action-btn:active {
            transform: scale(0.98);
            opacity: 0.9;
        }

        .action-btn:disabled {
            background: #b0bec5 !important;
            opacity: 0.7;
            transform: none;
            cursor: not-allowed;
        }

        .price-box {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 8px 0;
            background: #f5f0eb;
            padding: 8px;
            border-radius: 6px;
            font-size: 0.85rem;
        }

        .price-input {
            width: 80px;
            padding: 6px;
            font-weight: bold;
            text-align: right;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.9rem;
            background: #fff;
        }

        /* ボトムナビゲーション */
        #nav-tabs {
            display: flex;
            background: var(--accent-brown);
            overflow-x: auto;
            shrink: 0;
            z-index: 20;
            border-top: 1px solid rgba(255,255,255,0.1);
            padding-bottom: var(--safe-area-bottom);
            -webkit-overflow-scrolling: touch;
        }

        #nav-tabs::-webkit-scrollbar {
            display: none;
        }

        .tab-item {
            flex: 1;
            min-width: 68px;
            height: 52px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 0.68rem;
            font-weight: bold;
            color: #d7ccc8;
            border: none;
            background: none;
            cursor: pointer;
            white-space: nowrap;
            gap: 2px;
        }

        .tab-item span.icon {
            font-size: 1.1rem;
        }

        .tab-item.active {
            color: #ffffff;
            background: var(--accent-brown-light);
            border-top: 3px solid #ffb74d;
        }

        /* フローティング通知テキスト */
        .float-text {
            position: fixed;
            color: #1b5e20;
            font-weight: 800;
            font-size: 1.15rem;
            pointer-events: none;
            animation: floatUp 0.85s cubic-bezier(0.22, 1, 0.36, 1) forwards;
            z-index: 999;
            text-shadow: 0 1px 3px #ffffff;
            background: rgba(255,255,255,0.85);
            padding: 4px 12px;
            border-radius: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }

        @keyframes floatUp {
            0% { opacity: 0; transform: translate(-50%, 10px) scale(0.9); }
            20% { opacity: 1; transform: translate(-50%, 0) scale(1); }
            80% { opacity: 1; transform: translate(-50%, -20px) scale(1); }
            100% { opacity: 0; transform: translate(-50%, -35px) scale(0.95); }
        }

        .review-box {
            background: #fffde7;
            border: 1px solid #fff59d;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 8px;
            font-size: 0.82rem;
        }
    </style>
</head>

<div id="game-container">

<!-- STREAMING_CHUNK:Configuring state and mobile logic... -->
<script>
    let state = {
        money: 3000000,
        reputation: 0,
        hasShop: false,
        shopType: '',
        concept: 'standard',
        currentTab: 'kitchen',
        hour: 8,
        weather: '晴れ',
        buzzMultiplier: 1.0,
        
        // 財務累計
        totalRevenue: 0,
        totalCost: 0,
        totalLaborCost: 0,
        totalWasteCost: 0,

        // 人事
        staff: {
            partTime: 0,
            fullTime: 0,
            skillLevel: 1
        },

        // 設備
        equipment: {
            counter: false,
            coffeeMaker: false,
            kitchenLine: false,
            patisserieOven: false
        },

        // 原材料在庫
        ingredients: {
            beans: 0,
            milk: 0,
            flour: 0,
            fruits: 0
        },

        // レシピ
        recipes: [
            { id: 'coffee', name: 'ハウスブレンド', category: 'drink', icon: '☕', reqEquip: 'coffeeMaker', ingKey: 'beans', ingCost: 80, stdPrice: 550, price: 550, unlocked: true, stock: 0 },
            { id: 'latte', name: '濃厚カフェラテ', category: 'drink', icon: '🥛', reqEquip: 'coffeeMaker', ingKey: 'milk', ingCost: 110, stdPrice: 650, price: 650, unlocked: false, stock: 0 },
            { id: 'toast', name: '厚切りバタートースト', category: 'food', icon: '🍞', reqEquip: 'kitchenLine', ingKey: 'flour', ingCost: 150, stdPrice: 700, price: 700, unlocked: false, stock: 0 },
            { id: 'cake', name: '特製ショートケーキ', category: 'sweet', icon: '🍰', reqEquip: 'patisserieOven', ingKey: 'fruits', ingCost: 350, stdPrice: 1500, price: 1500, unlocked: false, stock: 0 }
        ],

        // 口コミ履歴
        reviews: [
            { stars: '⭐⭐⭐⭐⭐', text: 'オープンの日を楽しみにしています！', author: '近所の住民' }
        ]
    };

    function init() {
        render();
        setInterval(gameClockLoop, 3000); // 3秒で1時間進行
        setInterval(customerLoop, 1500);   // 来店判定
    }

    // STREAMING_CHUNK:Defining game loop and header updates...
    function gameClockLoop() {
        if (!state.hasShop) return;
        
        state.hour = (state.hour + 1) % 24;
        if (state.hour === 0) {
            state.hour = 7; // 朝7時に開店
            const weathers = ['晴れ', '晴れ', '曇り', '雨', '猛暑'];
            state.weather = weathers[Math.floor(Math.random() * weathers.length)];
            
            // 人件費の自動引き落とし
            const dailyLabor = (state.staff.partTime * 9600) + (state.staff.fullTime * 16000);
            if (dailyLabor > 0) {
                state.money -= dailyLabor;
                state.totalLaborCost += dailyLabor;
                showFloatText(`人件費清算 -${dailyLabor.toLocaleString()}円`);
            }
        }

        if (state.buzzMultiplier > 1.0) {
            state.buzzMultiplier = Math.max(1.0, state.buzzMultiplier - 0.05);
        }

        renderHeader();
    }

    function renderHeader() {
        document.getElementById('money').innerText = state.money.toLocaleString();
        document.getElementById('reputation').innerText = state.reputation.toLocaleString();
        document.getElementById('staff-count').innerText = state.staff.partTime + state.staff.fullTime;
        
        let timeZone = "通常";
        if (state.hour >= 7 && state.hour < 11) timeZone = "モーニング";
        else if (state.hour >= 11 && state.hour < 14) timeZone = "ランチ";
        else if (state.hour >= 14 && state.hour < 17) timeZone = "カフェ";
        else if (state.hour >= 17) timeZone = "ディナー";

        document.getElementById('time-display').innerText = `${String(state.hour).padStart(2, '0')}:00 (${timeZone})`;
        document.getElementById('weather-display').innerText = state.weather;
        document.getElementById('buzz-display').innerText = Math.round(state.buzzMultiplier * 100) + '%';
    }

    // STREAMING_CHUNK:Rendering viewport and mobile initial choice view...
    function render() {
        renderHeader();
        const view = document.getElementById('viewport');
        view.innerHTML = '';

        if (!state.hasShop) {
            document.getElementById('nav-tabs').style.display = 'none';
            view.innerHTML = `
                <div class="card" style="text-align:center; padding:18px 12px; background:linear-gradient(135deg, #fff, #fbe9e7);">
                    <div style="font-size:2.8rem; margin-bottom:4px;">☕</div>
                    <h2 style="font-size:1.15rem; color:var(--accent-brown);">カフェの開業計画</h2>
                    <p style="font-size:0.78rem; color:var(--text-sub); margin-top:4px;">資金 3,000,000円 でスタート。<br>出店するお店のコンセプトを選択してください。</p>
                </div>

                <div class="card">
                    <div style="font-weight:bold; font-size:1rem; color:var(--accent-brown);">☕ サードウェーブ本格カフェ</div>
                    <div style="font-size:0.78rem; color:var(--text-sub); margin:4px 0 8px 0;">珈琲の品質を追求。コーヒー・ラテの需要と客単価が高い。</div>
                    <button class="action-btn" onclick="startShop('自家焙煎本格カフェ', 'modern', 1500000)">1,500,000円で出店契約</button>
                </div>

                <div class="card">
                    <div style="font-weight:bold; font-size:1rem; color:var(--accent-brown);">🛋️ 昭和レトロ純喫茶</div>
                    <div style="font-size:0.78rem; color:var(--text-sub); margin:4px 0 8px 0;">落ち着いたレトロ空間。トーストやフード類の販売効率向上。</div>
                    <button class="action-btn" onclick="startShop('純喫茶 珈琲館', 'retro', 1200000)">1,200,000円で出店契約</button>
                </div>

                <div class="card">
                    <div style="font-weight:bold; font-size:1rem; color:var(--accent-brown);">🍰 映えスイーツカフェ</div>
                    <div style="font-size:0.78rem; color:var(--text-sub); margin:4px 0 8px 0;">SNS世代に人気。ケーキの利益率が高く集客キャンペーン効果絶大。</div>
                    <button class="action-btn" onclick="startShop('Sweets & Cafe', 'sweet', 1800000)">1,800,000円で出店契約</button>
                </div>
            `;
            return;
        }

        document.getElementById('nav-tabs').style.display = 'flex';
        document.getElementById('shop-name').innerText = state.shopType;
        
        const conceptNames = { standard:'標準', retro:'純喫茶', modern:'本格派', sweet:'スイーツ' };
        document.getElementById('concept-tag').innerText = conceptNames[state.concept] || '標準';

        if (state.currentTab === 'kitchen') renderKitchen(view);
        if (state.currentTab === 'staff') renderStaff(view);
        if (state.currentTab === 'promo') renderPromo(view);
        if (state.currentTab === 'report') renderReport(view);
        if (state.currentTab === 'reviews') renderReviews(view);
        if (state.currentTab === 'shop') renderShop(view);
    }

    // STREAMING_CHUNK:Rendering kitchen and items...
    function renderKitchen(view) {
        const supplier = document.createElement('div');
        supplier.className = 'card';
        supplier.style.background = '#fff8e1';
        supplier.innerHTML = `
            <div class="card-title">📦 原材料の卸仕入れ</div>
            <div style="font-size:0.8rem; display:flex; flex-direction:column; gap:8px;">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <span>☕ 珈琲豆 (50杯): 4,000円<br><small style="color:var(--text-sub);">在庫: ${state.ingredients.beans}</small></span>
                    <button style="padding:6px 12px; background:var(--accent-brown); color:#fff; border:none; border-radius:6px; font-weight:bold;" onclick="buyIng('beans', 4000, 50)">購入</button>
                </div>
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <span>🥛 特選牛乳 (30杯): 3,300円<br><small style="color:var(--text-sub);">在庫: ${state.ingredients.milk}</small></span>
                    <button style="padding:6px 12px; background:var(--accent-brown); color:#fff; border:none; border-radius:6px; font-weight:bold;" onclick="buyIng('milk', 3300, 30)">購入</button>
                </div>
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <span>🍞 パン資材 (20食): 3,000円<br><small style="color:var(--text-sub);">在庫: ${state.ingredients.flour}</small></span>
                    <button style="padding:6px 12px; background:var(--accent-brown); color:#fff; border:none; border-radius:6px; font-weight:bold;" onclick="buyIng('flour', 3000, 20)">購入</button>
                </div>
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <span>🍰 果物資材 (10食): 3,500円<br><small style="color:var(--text-sub);">在庫: ${state.ingredients.fruits}</small></span>
                    <button style="padding:6px 12px; background:var(--accent-brown); color:#fff; border:none; border-radius:6px; font-weight:bold;" onclick="buyIng('fruits', 3500, 10)">購入</button>
                </div>
            </div>
        `;
        view.appendChild(supplier);

        state.recipes.filter(r => r.unlocked).forEach(r => {
            const hasIng = state.ingredients[r.ingKey] > 0;
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div class="card-title">
                    <span>${r.icon} ${r.name}</span>
                    <span style="font-size:0.75rem; background:#ffe0b2; padding:2px 8px; border-radius:12px; color:#e65100;">仕込み数: ${r.stock}個</span>
                </div>
                <div style="font-size:0.78rem; color:var(--text-sub);">原価: 約${r.ingCost}円 | 標準価格: ${r.stdPrice}円</div>
                
                <div class="price-box">
                    <span>販売価格の設定:</span>
                    <div>
                        <input type="number" class="price-input" id="price-${r.id}" value="${r.price}"> 円
                        <button style="padding:6px 10px; background:#1976d2; color:#fff; border:none; border-radius:6px; font-size:0.8rem; margin-left:4px;" onclick="setPrice('${r.id}')">保存</button>
                    </div>
                </div>

                <button class="action-btn" ${!hasIng ? 'disabled' : ''} onclick="cookRecipe('${r.id}')">
                    ${hasIng ? '仕込み調理を行う (材料1消費)' : '原材料が不足しています'}
                </button>
            `;
            view.appendChild(card);
        });
    }

    function renderStaff(view) {
        view.innerHTML = `
            <div class="card">
                <div class="card-title">👥 スタッフの採用・育成</div>
                <p style="font-size:0.78rem; color:var(--text-sub); margin-bottom:12px;">スタッフを採用すると混雑時でもスムーズに提供が行えます。</p>
                
                <div style="font-size:0.82rem; display:flex; flex-direction:column; gap:12px;">
                    <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #eee; padding-bottom:8px;">
                        <span>🙋‍♂️ アルバイト: <strong>${state.staff.partTime}名</strong><br><small style="color:var(--text-sub);">日給: 9,600円 / 人</small></span>
                        <button style="padding:8px 12px; background:var(--accent-green); color:#fff; border:none; border-radius:6px; font-weight:bold;" onclick="hireStaff('partTime', 50000)">採用 (5万円)</button>
                    </div>
                    <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #eee; padding-bottom:8px;">
                        <span>👨‍🍳 専属シェフ: <strong>${state.staff.fullTime}名</strong><br><small style="color:var(--text-sub);">日給: 16,000円 / 人</small></span>
                        <button style="padding:8px 12px; background:var(--accent-green); color:#fff; border:none; border-radius:6px; font-weight:bold;" onclick="hireStaff('fullTime', 150000)">採用 (15万円)</button>
                    </div>
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <span>🎓 研修レベル: <strong>Lv.${state.staff.skillLevel}</strong><br><small style="color:var(--text-sub);">提供スピード +15%</small></span>
                        <button style="padding:8px 12px; background:#1976d2; color:#fff; border:none; border-radius:6px; font-weight:bold;" onclick="trainStaff(100000)">研修 (10万円)</button>
                    </div>
                </div>
            </div>
        `;
    }

    function renderPromo(view) {
        view.innerHTML = `
            <div class="card">
                <div class="card-title">📢 プロモーション活動</div>
                <p style="font-size:0.78rem; color:var(--text-sub); margin-bottom:10px;">宣伝により集客力（バズ率）を高め、来店頻度を上昇させます。</p>

                <div style="display:flex; flex-direction:column; gap:10px;">
                    <div style="border:1px solid var(--border-color); padding:10px; border-radius:8px;">
                        <strong>📄 近隣チラシ配り</strong><br>
                        <small style="color:var(--text-sub);">費用: 30,000円 | 集客力 +30%</small>
                        <button class="action-btn" onclick="runPromo(30000, 0.3)">チラシを配る</button>
                    </div>

                    <div style="border:1px solid var(--border-color); padding:10px; border-radius:8px;">
                        <strong>📱 SNS映えプレゼント企画</strong><br>
                        <small style="color:var(--text-sub);">費用: 100,000円 | 集客力 +80%</small>
                        <button class="action-btn" onclick="runPromo(100000, 0.8)">企画を実施する</button>
                    </div>

                    <div style="border:1px solid var(--border-color); padding:10px; border-radius:8px;">
                        <strong>📺 グルメ誌・WEB取材獲得</strong><br>
                        <small style="color:var(--text-sub);">費用: 300,000円 | 集客力 +200% (大爆発)</small>
                        <button class="action-btn" onclick="runPromo(300000, 2.0)">取材を依頼する</button>
                    </div>
                </div>
            </div>
        `;
    }

    function renderReport(view) {
        const grossProfit = state.totalRevenue - state.totalCost;
        const netProfit = grossProfit - state.totalLaborCost - state.totalWasteCost;

        view.innerHTML = `
            <div class="card">
                <div class="card-title">📊 損益計算書 (P&L)</div>
                <div style="font-size:0.85rem; display:flex; flex-direction:column; gap:8px;">
                    <div style="display:flex; justify-content:space-between;"><span>💵 売上高:</span><strong>+${state.totalRevenue.toLocaleString()}円</strong></div>
                    <div style="display:flex; justify-content:space-between; color:var(--accent-red);"><span>📦 仕入れ原価:</span><span>-${state.totalCost.toLocaleString()}円</span></div>
                    <div style="border-bottom:1px solid #ccc; margin:2px 0;"></div>
                    <div style="display:flex; justify-content:space-between;"><span>📈 売上総利益 (粗利):</span><strong>${grossProfit.toLocaleString()}円</strong></div>
                    <div style="display:flex; justify-content:space-between; color:var(--accent-red);"><span>👥 人件費累計:</span><span>-${state.totalLaborCost.toLocaleString()}円</span></div>
                    <div style="border-bottom:2px solid var(--border-color); margin:4px 0;"></div>
                    <div style="display:flex; justify-content:space-between; font-size:1.05rem; font-weight:bold;">
                        <span>💰 営業純利益:</span>
                        <span style="color:${netProfit >= 0 ? 'var(--accent-green)' : 'var(--accent-red)'}">${netProfit.toLocaleString()}円</span>
                    </div>
                </div>
            </div>
        `;
    }

    function renderReviews(view) {
        let html = `<div class="card"><div class="card-title">⭐ お客様のリアル口コミ</div>`;
        state.reviews.slice(-6).reverse().forEach(r => {
            html += `
                <div class="review-box">
                    <div style="display:flex; justify-content:space-between; font-weight:bold; margin-bottom:2px;">
                        <span>${r.stars}</span>
                        <span style="color:var(--text-sub); font-size:0.75rem;">${r.author}</span>
                    </div>
                    <div>"${r.text}"</div>
                </div>
            `;
        });
        html += `</div>`;
        view.innerHTML = html;
    }

    function renderShop(view) {
        view.innerHTML = `
            <div class="card">
                <div class="card-title">⚙️ 設備投資・メニュー解放</div>
                <div style="font-size:0.82rem; display:flex; flex-direction:column; gap:12px;">
                    <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #eee; padding-bottom:6px;">
                        <span>🧾 メインカウンターレジ<br><small style="color:var(--text-sub);">${state.equipment.counter ? '✅導入完了' : '350,000円'}</small></span>
                        ${!state.equipment.counter ? `<button style="padding:6px 12px; background:var(--accent-green); color:#fff; border:none; border-radius:6px; font-weight:bold;" onclick="buyEquip('counter', 350000)">購入</button>` : ''}
                    </div>
                    <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #eee; padding-bottom:6px;">
                        <span>☕ エスプレッソマシン<br><small style="color:var(--text-sub);">${state.equipment.coffeeMaker ? '✅導入完了' : '480,000円 (ラテ解放)'}</small></span>
                        ${!state.equipment.coffeeMaker ? `<button style="padding:6px 12px; background:var(--accent-green); color:#fff; border:none; border-radius:6px; font-weight:bold;" onclick="buyEquip('coffeeMaker', 480000)">購入</button>` : ''}
                    </div>
                    <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #eee; padding-bottom:6px;">
                        <span>🍞 厨房IHトースター<br><small style="color:var(--text-sub);">${state.equipment.kitchenLine ? '✅導入完了' : '300,000円 (トースト解放)'}</small></span>
                        ${!state.equipment.kitchenLine ? `<button style="padding:6px 12px; background:var(--accent-green); color:#fff; border:none; border-radius:6px; font-weight:bold;" onclick="buyEquip('kitchenLine', 300000)">購入</button>` : ''}
                    </div>
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <span>🍰 コンベクションオーブン<br><small style="color:var(--text-sub);">${state.equipment.patisserieOven ? '✅導入完了' : '600,000円 (ケーキ解放)'}</small></span>
                        ${!state.equipment.patisserieOven ? `<button style="padding:6px 12px; background:var(--accent-green); color:#fff; border:none; border-radius:6px; font-weight:bold;" onclick="buyEquip('patisserieOven', 600000)">購入</button>` : ''}
                    </div>
                </div>
            </div>
        `;
    }

    // STREAMING_CHUNK:Handlers and interactions...
    function startShop(name, concept, cost) {
        if (state.money >= cost) {
            state.money -= cost;
            state.shopType = name;
            state.concept = concept;
            state.hasShop = true;
            render();
        }
    }

    function buyIng(key, price, amount) {
        if (state.money >= price) {
            state.money -= price;
            state.totalCost += price;
            state.ingredients[key] += amount;
            showFloatText(`材料入荷 +${amount}`);
            render();
        }
    }

    function setPrice(id) {
        const val = parseInt(document.getElementById(`price-${id}`).value, 10);
        const r = state.recipes.find(rec => rec.id === id);
        if (r && val > 0) {
            r.price = val;
            showFloatText(`価格改定: ${val}円`);
            render();
        }
    }

    function cookRecipe(id) {
        const r = state.recipes.find(rec => rec.id === id);
        if (r && state.ingredients[r.ingKey] > 0) {
            state.ingredients[r.ingKey] -= 1;
            r.stock += 1;
            showFloatText(`${r.name} +1`);
            render();
        }
    }

    function hireStaff(type, fee) {
        if (state.money >= fee) {
            state.money -= fee;
            state.staff[type] += 1;
            showFloatText(`スタッフ採用！`);
            render();
        }
    }

    function trainStaff(cost) {
        if (state.money >= cost) {
            state.money -= cost;
            state.staff.skillLevel += 1;
            showFloatText(`スキル向上 Lv.${state.staff.skillLevel}`);
            render();
        }
    }

    function runPromo(cost, addBuzz) {
        if (state.money >= cost) {
            state.money -= cost;
            state.buzzMultiplier += addBuzz;
            showFloatText(`集客力アップ！`);
            render();
        }
    }

    function buyEquip(key, price) {
        if (state.money >= price) {
            state.money -= price;
            state.equipment[key] = true;

            if (key === 'coffeeMaker') unlockRecipe('latte');
            if (key === 'kitchenLine') unlockRecipe('toast');
            if (key === 'patisserieOven') unlockRecipe('cake');

            showFloatText(`設備導入完了！`);
            render();
        }
    }

    function unlockRecipe(id) {
        const r = state.recipes.find(rec => rec.id === id);
        if (r) r.unlocked = true;
    }

    function customerLoop() {
        if (!state.hasShop || !state.equipment.counter) return;

        const available = state.recipes.filter(r => r.unlocked && r.stock > 0);
        if (available.length === 0) return;

        let chance = 0.45 * state.buzzMultiplier;
        if (state.weather === '雨') chance *= 0.65;
        if (state.weather === '猛暑') chance *= 0.8;

        if (Math.random() < chance) {
            const target = available[Math.floor(Math.random() * available.length)];
            
            if (target.price > target.stdPrice * 1.4) {
                addReview('⭐', `「${target.name}」の値段が少し高すぎます...`);
                return;
            }

            target.stock -= 1;
            state.money += target.price;
            state.totalRevenue += target.price;
            state.reputation += 2;
            showFloatText(`+${target.price.toLocaleString()}円`);

            if (Math.random() < 0.25) {
                addReview('⭐⭐⭐⭐⭐', `「${target.name}」が最高でした！満足です。`);
            }

            render();
        }
    }

    function addReview(stars, text) {
        state.reviews.push({ stars, text, author: 'お客様' });
        if (state.reviews.length > 20) state.reviews.shift();
    }

    function switchTab(t) {
        state.currentTab = t;
        document.querySelectorAll('.tab-item').forEach(b => b.classList.remove('active'));
        const activeBtn = document.getElementById(`tab-${t}`);
        if (activeBtn) activeBtn.classList.add('active');
        render();
    }

    function showFloatText(txt) {
        const el = document.createElement('div');
        el.className = 'float-text';
        el.innerText = txt;
        el.style.left = '50%';
        el.style.top = '38%';
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 850);
    }

    window.onload = init;
</script>
</body>
</html>
